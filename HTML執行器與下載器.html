<!DOCTYPE html>
<!-- saved from url=(0048)https://cch98879.github.io/AI/download_html.html -->
<html lang="zh-Hant"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>讓AI解決我的生活大小事_HTML執行器/下載器</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e293b);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;color:#e2e8f0}.wrap{width:min(1400px,94vw);margin:28px auto}.header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.title h1{margin:0;font-size:clamp(24px,3vw,38px)}.title p{margin:6px 0 0;color:#94a3b8}.actions{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:800;cursor:pointer;color:#fff;background:#334155;transition:.15s}button:hover{transform:translateY(-1px);filter:brightness(1.1)}.run{background:#16a34a}.download{background:#2563eb}.clear{background:#475569}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#111827dd;border:1px solid #334155;border-radius:16px;overflow:hidden;box-shadow:0 18px 50px #0005}.bar{height:48px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#1e293b;border-bottom:1px solid #334155;font-weight:800}.hint{font-size:12px;color:#94a3b8;font-weight:500}textarea{display:block;width:100%;height:600px;resize:vertical;border:0;outline:0;background:#0b1220;color:#e2e8f0;padding:18px;font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}iframe{display:block;width:100%;height:600px;border:0;background:#fff}.status{margin-top:12px;color:#94a3b8;font-size:13px}.kbd{padding:2px 7px;border:1px solid #475569;border-radius:5px;color:#cbd5e1}@media(max-width:850px){.grid{grid-template-columns:1fr}.header{align-items:flex-start;flex-direction:column}textarea,iframe{height:480px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="title"><h1>💻 讓AI解決我的生活大小事_HTML執行器/下載器</h1><p>貼上 HTML 程式碼 → 執行預覽 → 下載 HTML 檔案</p></div>
    <div class="actions"><button class="run" id="run">▶ 執行</button><button class="download" id="download">⬇ 下載</button><button class="clear" id="clear">🗑 清除</button></div>
  </div>
  <div class="grid">
    <section class="panel">
	<div class="bar"><span>HTML程式碼</span><span class="hint">Ctrl + Enter 可執行</span></div>
	<textarea id="code" spellcheck="false" placeholder="請在這裡貼上 HTML 程式碼…">
請於此區貼上HTML程式碼</textarea></section>
    <section class="panel"><div class="bar"><span>執行結果</span><span class="hint">獨立預覽區</span></div><iframe id="preview" title="HTML 預覽" sandbox="allow-scripts allow-forms allow-modals allow-popups" src="./download_html_files/saved_resource.html"></iframe></section>
  </div>
  <div class="status" id="status">✅ HTML已執行並顯示於右側預覽區。</div>
</div>
<script>
const code=document.getElementById('code'),preview=document.getElementById('preview'),status=document.getElementById('status');
function runCode(){preview.srcdoc=code.value;status.textContent='✅ HTML 已執行並顯示於右側預覽區。'}
function downloadCode(){const blob=new Blob([code.value],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='index.html';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);status.textContent='⬇️ 已下載 HTML 檔案：index.html';}
document.getElementById('run').addEventListener('click',runCode);document.getElementById('download').addEventListener('click',downloadCode);document.getElementById('clear').addEventListener('click',()=>{code.value='';preview.srcdoc='';status.textContent='🗑️ 已清除程式碼與預覽結果。';code.focus()});code.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();runCode()}});runCode();
</script>


</body></html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>讓AI解決我的生活大小事_3D圖片檢視器</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:
        "Segoe UI",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
    background:#0b1020;
    color:#fff;
}

body{
    display:flex;
    flex-direction:column;
}

/* =========================
   頂部
========================= */

.topbar{
    height:72px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;

    background:
        linear-gradient(
            90deg,
            rgba(15,23,42,.98),
            rgba(30,41,59,.96)
        );

    border-bottom:1px solid rgba(255,255,255,.1);

    box-shadow:
        0 8px 30px rgba(0,0,0,.25);

    z-index:10;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.brandIcon{
    width:42px;
    height:42px;
    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:21px;

    background:
        linear-gradient(
            135deg,
            #60a5fa,
            #8b5cf6
        );

    box-shadow:
        0 8px 25px rgba(96,165,250,.3);
}

.brandText{
    line-height:1.15;
}

.brandTitle{
    font-size:18px;
    font-weight:700;
    letter-spacing:.5px;
}

.brandSub{
    font-size:11px;
    color:#94a3b8;
    margin-top:4px;
}

.uploadBtn{
    position:relative;
    overflow:hidden;

    border:0;
    border-radius:12px;

    padding:12px 18px;

    color:#fff;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    font-size:14px;
    font-weight:600;

    box-shadow:
        0 8px 22px rgba(37,99,235,.25);

    transition:.2s;
}

.uploadBtn:hover{
    transform:translateY(-2px);
    box-shadow:
        0 12px 28px rgba(37,99,235,.35);
}

.uploadBtn input{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
}

/* =========================
   主畫面
========================= */

.main{
    flex:1;
    min-height:0;

    display:flex;
}

/* =========================
   左側控制面板
========================= */

.sidebar{
    width:290px;
    flex-shrink:0;

    padding:22px;

    overflow-y:auto;

    background:
        rgba(15,23,42,.92);

    border-right:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(15px);
}

.section{
    margin-bottom:24px;
}

.sectionTitle{
    margin-bottom:11px;

    color:#94a3b8;

    font-size:11px;
    font-weight:700;

    letter-spacing:1.4px;
}

.productInfo{
    padding:15px;

    border-radius:15px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.07);
}

.productName{
    font-size:16px;
    font-weight:700;
}

.productDescription{
    margin-top:6px;

    color:#94a3b8;

    font-size:12px;
    line-height:1.6;
}

/* =========================
   控制按鈕
========================= */

.controlGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.controlBtn{
    border:1px solid rgba(255,255,255,.09);

    border-radius:11px;

    padding:12px 8px;

    color:#e2e8f0;

    background:
        rgba(255,255,255,.045);

    cursor:pointer;

    transition:.2s;

    font-size:12px;
}

.controlBtn:hover{
    background:
        rgba(255,255,255,.1);

    transform:translateY(-1px);
}

.controlBtn.active{
    background:
        linear-gradient(
            135deg,
            rgba(37,99,235,.8),
            rgba(124,58,237,.8)
        );

    border-color:
        rgba(147,197,253,.4);
}

/* =========================
   色彩
========================= */

.colorGrid{
    display:grid;
    grid-template-columns:
        repeat(5,1fr);

    gap:8px;
}

.colorBtn{
    width:100%;
    aspect-ratio:1;

    border-radius:10px;

    border:2px solid transparent;

    cursor:pointer;

    transition:.2s;
}

.colorBtn:hover{
    transform:scale(1.08);
}

.colorBtn.active{
    border-color:#fff;

    box-shadow:
        0 0 0 2px rgba(255,255,255,.2);
}

/* =========================
   燈光
========================= */

.lightRange{
    width:100%;
    accent-color:#60a5fa;
}

.rangeValue{
    display:flex;
    justify-content:space-between;

    color:#94a3b8;

    font-size:11px;

    margin-top:5px;
}

/* =========================
   畫布
========================= */

.viewer{
    position:relative;

    flex:1;

    min-width:0;
    min-height:0;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(59,130,246,.08),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #0f172a,
            #111827
        );
}

#canvasContainer{
    width:100%;
    height:100%;
}

canvas{
    display:block;
}

/* =========================
   空白提示
========================= */

.emptyState{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    text-align:center;

    pointer-events:none;

    transition:.3s;
}

.emptyIcon{
    width:76px;
    height:76px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:24px;

    font-size:34px;

    color:#93c5fd;

    background:
        rgba(59,130,246,.08);

    border:
        1px solid rgba(96,165,250,.15);

    box-shadow:
        0 15px 45px rgba(0,0,0,.2);
}

.emptyTitle{
    margin-top:18px;

    font-size:18px;
    font-weight:600;
}

.emptyText{
    margin-top:8px;

    color:#64748b;

    font-size:12px;
}

/* =========================
   右上狀態
========================= */

.viewerStatus{
    position:absolute;

    top:20px;
    right:20px;

    padding:8px 12px;

    border-radius:20px;

    color:#cbd5e1;

    background:
        rgba(15,23,42,.72);

    border:
        1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(10px);

    font-size:11px;
}

.statusDot{
    display:inline-block;

    width:7px;
    height:7px;

    margin-right:6px;

    border-radius:50%;

    background:#64748b;
}

.statusDot.ready{
    background:#22c55e;

    box-shadow:
        0 0 10px #22c55e;
}

/* =========================
   底部操作
========================= */

.bottomTools{
    position:absolute;

    left:50%;
    bottom:22px;

    transform:translateX(-50%);

    display:flex;

    gap:8px;

    padding:8px;

    border-radius:15px;

    background:
        rgba(15,23,42,.78);

    border:
        1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(15px);

    box-shadow:
        0 15px 35px rgba(0,0,0,.25);
}

.toolBtn{
    min-width:42px;
    height:40px;

    border:0;
    border-radius:10px;

    color:#e2e8f0;

    background:
        rgba(255,255,255,.06);

    cursor:pointer;

    font-size:16px;

    transition:.2s;
}

.toolBtn:hover{
    background:
        rgba(255,255,255,.12);

    transform:translateY(-1px);
}

.toolBtn.danger:hover{
    background:
        rgba(239,68,68,.2);
}

/* =========================
   手機版
========================= */

@media(max-width:760px){

    .topbar{
        height:62px;
        padding:0 14px;
    }

    .brandTitle{
        font-size:15px;
    }

    .brandSub{
        display:none;
    }

    .brandIcon{
        width:36px;
        height:36px;
        font-size:18px;
    }

    .uploadBtn{
        padding:10px 13px;
        font-size:12px;
    }

    .main{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        height:auto;

        max-height:230px;

        padding:12px 14px;

        border-right:0;
        border-bottom:
            1px solid rgba(255,255,255,.08);

        display:flex;
        gap:18px;

        overflow-x:auto;
        overflow-y:hidden;
    }

    .section{
        min-width:210px;
        margin-bottom:0;
    }

    .viewer{
        min-height:0;
    }

    .bottomTools{
        bottom:12px;
    }

}

/* =========================
   拖曳提示
========================= */

.viewer.dragover{
    box-shadow:
        inset 0 0 0 3px rgba(96,165,250,.55);

    background:
        radial-gradient(
            circle,
            rgba(59,130,246,.15),
            transparent 45%
        ),
        #0f172a;
}

</style>
</head>

<body>

<!-- =========================
     頂部
========================= -->

<header class="topbar">

    <div class="brand">

        <div class="brandIcon">
            ◈
        </div>

        <div class="brandText">

            <div class="brandTitle">
                3D圖片檢視器
            </div>

            <div class="brandSub">
                讓AI解決我的生活大小事
            </div>

        </div>

    </div>

    <label class="uploadBtn">

        ＋ 上傳圖檔

        <input
            type="file"
            id="fileInput"
            accept=".jpg,.jpeg,.png,.webp,.glb,.gltf"
        >

    </label>

</header>


<!-- =========================
     主畫面
========================= -->

<main class="main">


    <!-- 左側控制 -->

    <aside class="sidebar">


        <!-- 產品資訊 -->

        <div class="section">

            <div class="productInfo">

                <div
                    class="productName"
                    id="productName"
                >
                    尚未有圖檔
                </div>

                <div
                    class="productDescription"
                    id="productDescription"
                >
                    請上傳圖檔
                </div>

            </div>

        </div>


        <!-- 操作 -->

        <div class="section">

            <div class="sectionTitle">
                控制面版
            </div>

            <div class="controlGrid">

                <button
                    class="controlBtn"
                    id="autoRotateBtn"
                >
                    ↻ 自動旋轉
                </button>

                <button
                    class="controlBtn"
                    id="resetBtn"
                >
                    ⟳ 重設視角
                </button>

                <button
                    class="controlBtn"
                    id="zoomInBtn"
                >
                    ＋ 放大
                </button>

                <button
                    class="controlBtn"
                    id="zoomOutBtn"
                >
                    − 縮小
                </button>

            </div>

        </div>





        <!-- 燈光 -->

        <div class="section">

            <div class="sectionTitle">
                亮度
            </div>

            <input
                type="range"
                id="lightRange"
                class="lightRange"
                min="0"
                max="3"
                step="0.05"
                value="1.4"
            >

            <div class="rangeValue">

                <span>柔和</span>

                <span id="lightValue">
                    1.40
                </span>

                <span>明亮</span>

            </div>

        </div>




    </aside>


    <!-- 3D 區域 -->

    <section
        class="viewer"
        id="viewer"
    >

        <div
            id="canvasContainer"
        ></div>


        <!-- 空白狀態 -->

        <div
            class="emptyState"
            id="emptyState"
        >

            <div class="emptyIcon">
                ◇
            </div>

            <div class="emptyTitle">
                尚未有圖檔
            </div>

            <div class="emptyText">
                上傳圖檔來展示
            </div>

        </div>


        <!-- 狀態 -->

        <div class="viewerStatus">

            <span
                class="statusDot"
                id="statusDot"
            ></span>

            <span id="statusText">
                WAITING
            </span>

        </div>


        <!-- 底部工具 -->

        <div class="bottomTools">

            <button
                class="toolBtn"
                id="bottomReset"
                title="重設視角"
            >
                ⟳
            </button>

            <button
                class="toolBtn"
                id="bottomZoomIn"
                title="放大"
            >
                ＋
            </button>

            <button
                class="toolBtn"
                id="bottomZoomOut"
                title="縮小"
            >
                −
            </button>

            <button
                class="toolBtn danger"
                id="clearBtn"
                title="清除"
            >
                ×
            </button>

        </div>

    </section>

</main>


<script>

/* =========================================================
   基本設定
========================================================= */

let scene;
let camera;
let renderer;
let controls;

let product = null;

let uploadedObject = null;
let uploadedTexture = null;

let autoRotate = false;

let ambientLight;
let keyLight;
let fillLight;


/* =========================================================
   初始化
========================================================= */

function init(){

    const container =
        document.getElementById(
            "canvasContainer"
        );


    /* Scene */

    scene =
        new THREE.Scene();


    /* Camera */

    camera =
        new THREE.PerspectiveCamera(
            45,
            container.clientWidth /
            container.clientHeight,
            0.1,
            1000
        );

    camera.position.set(
        0,
        0,
        6
    );


    /* Renderer */

    renderer =
        new THREE.WebGLRenderer({
            antialias:true,
            alpha:true
        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );

    renderer.outputEncoding =
        THREE.sRGBEncoding;

    container.appendChild(
        renderer.domElement
    );


    /* Controls */

    controls =
        new THREE.OrbitControls(
            camera,
            renderer.domElement
        );

    controls.enableDamping = true;

    controls.dampingFactor = 0.07;

    controls.minDistance = 2;
    controls.maxDistance = 15;

    controls.target.set(
        0,
        0,
        0
    );


    /* =========================
       燈光
    ========================= */

    ambientLight =
        new THREE.AmbientLight(
            0xffffff,
            1.4
        );

    scene.add(
        ambientLight
    );


    keyLight =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );

    keyLight.position.set(
        4,
        6,
        5
    );

    scene.add(
        keyLight
    );


    fillLight =
        new THREE.DirectionalLight(
            0x88aaff,
            .8
        );

    fillLight.position.set(
        -4,
        2,
        -3
    );

    scene.add(
        fillLight
    );


    /* Resize */

    window.addEventListener(
        "resize",
        onResize
    );


    /* Drag & Drop */

    setupDragDrop();


    /* 動畫 */

    animate();

}


/* =========================================================
   Resize
========================================================= */

function onResize(){

    const container =
        document.getElementById(
            "canvasContainer"
        );

    if(!container){
        return;
    }

    const width =
        container.clientWidth;

    const height =
        container.clientHeight;

    camera.aspect =
        width / height;

    camera.updateProjectionMatrix();

    renderer.setSize(
        width,
        height
    );

}


/* =========================================================
   動畫
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(
        autoRotate &&
        uploadedObject
    ){

        uploadedObject.rotation.y
            += 0.006;

    }


    controls.update();

    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   上傳檔案
========================================================= */

document
.getElementById("fileInput")
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file){
            return;
        }

        loadFile(file);

    }
);


/* =========================================================
   判斷檔案
========================================================= */

function loadFile(file){

    clearCurrentObject();


    const name =
        file.name.toLowerCase();


    if(
        name.endsWith(".jpg") ||
        name.endsWith(".jpeg") ||
        name.endsWith(".png") ||
        name.endsWith(".webp")
    ){

        loadImage(
            file
        );

        return;

    }


    if(
        name.endsWith(".glb") ||
        name.endsWith(".gltf")
    ){

        loadModel(
            file
        );

        return;

    }


    alert(
        "不支援的檔案格式"
    );

}


/* =========================================================
   載入圖片
========================================================= */

function loadImage(file){

    const reader =
        new FileReader();


    reader.onload =
        function(e){

            const image =
                new Image();


            image.onload =
                function(){

                    uploadedTexture =
                        new THREE.Texture(
                            image
                        );

                    uploadedTexture
                        .needsUpdate = true;

                    uploadedTexture
                        .encoding =
                        THREE.sRGBEncoding;


                    const aspect =
                        image.width /
                        image.height;


                    let width = 4;

                    let height =
                        width / aspect;


                    if(height > 4){

                        height = 4;

                        width =
                            height * aspect;

                    }


                    const geometry =
                        new THREE.PlaneGeometry(
                            width,
                            height
                        );


                    const material =
                        new THREE.MeshStandardMaterial({

                            map:
                                uploadedTexture,

                            side:
                                THREE.DoubleSide,

                            roughness:
                                .38,

                            metalness:
                                .08

                        });


                    uploadedObject =
                        new THREE.Mesh(
                            geometry,
                            material
                        );


                    uploadedObject.position.set(
                        0,
                        0,
                        0
                    );


                    scene.add(
                        uploadedObject
                    );


                    product =
                        uploadedObject;


                    updateProductUI(
                        file.name,
                        "2D 圖片 3D 展示模式"
                    );


                    fitObject(
                        uploadedObject
                    );


                    showLoadedState();
					
					
/* 上傳成功後自動旋轉 */
autoRotate = true;

document
.getElementById("autoRotateBtn")
.classList.add("active");

                };


            image.src =
                e.target.result;

        };


    reader.readAsDataURL(
        file
    );

}


/* =========================================================
   載入 GLB / GLTF
========================================================= */

function loadModel(file){

    const loader =
        new THREE.GLTFLoader();


    const url =
        URL.createObjectURL(
            file
        );


    setStatus(
        "LOADING",
        false
    );


    loader.load(

        url,

        function(gltf){

            uploadedObject =
                gltf.scene;


            product =
                uploadedObject;


            uploadedObject.traverse(
                function(child){

                    if(
                        child.isMesh
                    ){

                        child.castShadow =
                            true;

                        child.receiveShadow =
                            true;

                    }

                }
            );


            scene.add(
                uploadedObject
            );


            fitObject(
                uploadedObject
            );


            updateProductUI(
                file.name,
                "GLB / GLTF 真正 3D 模型"
            );


            showLoadedState();
			
/* 上傳成功後自動旋轉 */
autoRotate = true;

document
.getElementById("autoRotateBtn")
.classList.add("active");

            URL.revokeObjectURL(
                url
            );

        },

        function(progress){

            if(
                progress.total
            ){

                const percent =
                    Math.round(
                        progress.loaded /
                        progress.total *
                        100
                    );

                setStatus(
                    "載入中 " +
                    percent +
                    "%",
                    false
                );

            }

        },

        function(error){

            console.error(
                error
            );

            alert(
                "3D 模型載入失敗。\n\n" +
                "建議優先使用 GLB 格式。"
            );

            setStatus(
                "ERROR",
                false
            );

        }

    );

}


/* =========================================================
   讓模型適合畫面
========================================================= */

function fitObject(object){

    const box =
        new THREE.Box3()
        .setFromObject(
            object
        );


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    object.position.x
        -= center.x;

    object.position.y
        -= center.y;

    object.position.z
        -= center.z;


    const maxSize =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    const scale =
        3.2 / maxSize;


    object.scale.setScalar(
        scale
    );


    resetCamera();

}


/* =========================================================
   重設相機
========================================================= */

function resetCamera(){

    camera.position.set(
        0,
        0,
        6
    );


    controls.target.set(
        0,
        0,
        0
    );


    controls.update();

}


/* =========================================================
   放大
========================================================= */

function zoomIn(){

    camera.position.multiplyScalar(
        0.85
    );

}


/* =========================================================
   縮小
========================================================= */

function zoomOut(){

    camera.position.multiplyScalar(
        1.18
    );

}


/* =========================================================
   自動旋轉
========================================================= */

function toggleAutoRotate(){

    autoRotate =
        !autoRotate;


    const btn =
        document.getElementById(
            "autoRotateBtn"
        );


    btn.classList.toggle(
        "active",
        autoRotate
    );

}


/* =========================================================
   顏色
========================================================= */

document
.querySelectorAll(".colorBtn")
.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                document
                .querySelectorAll(
                    ".colorBtn"
                )
                .forEach(
                    b =>
                    b.classList.remove(
                        "active"
                    )
                );


                button.classList.add(
                    "active"
                );


                const color =
                    button.dataset.color;


                if(
                    !uploadedObject
                ){
                    return;
                }


                uploadedObject.traverse(
                    function(child){

                        if(
                            child.isMesh &&
                            child.material
                        ){

                            if(
                                child.material
                                .color
                            ){

                                child.material
                                    .color
                                    .set(
                                        color
                                    );

                            }

                        }

                    }
                );

            }
        );

    }
);


/* =========================================================
   燈光
========================================================= */

document
.getElementById(
    "lightRange"
)
.addEventListener(
    "input",
    function(){

        const value =
            Number(
                this.value
            );


        ambientLight.intensity =
            value;


        document
        .getElementById(
            "lightValue"
        )
        .textContent =
            value.toFixed(2);

    }
);


/* =========================================================
   背景
========================================================= */

document
.querySelectorAll(".bgBtn")
.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                document
                .querySelectorAll(
                    ".bgBtn"
                )
                .forEach(
                    b =>
                    b.classList.remove(
                        "active"
                    )
                );


                button.classList.add(
                    "active"
                );


                const color =
                    button.dataset.bg;


                document
                .querySelector(
                    ".viewer"
                )
                .style.background =
                    color;

            }
        );

    }
);


/* =========================================================
   清除目前物件
========================================================= */

function clearCurrentObject(){

    if(
        uploadedObject
    ){

        scene.remove(
            uploadedObject
        );


        uploadedObject.traverse(
            function(child){

                if(
                    child.geometry
                ){

                    child.geometry.dispose();

                }


                if(
                    child.material
                ){

                    if(
                        Array.isArray(
                            child.material
                        )
                    ){

                        child.material
                        .forEach(
                            disposeMaterial
                        );

                    }
                    else{

                        disposeMaterial(
                            child.material
                        );

                    }

                }

            }
        );

    }


    uploadedObject =
        null;

    uploadedTexture =
        null;

    product =
        null;

}


/* =========================================================
   材質釋放
========================================================= */

function disposeMaterial(
    material
){

    if(
        material.map
    ){

        material.map.dispose();

    }

    material.dispose();

}


/* =========================================================
   清除按鈕
========================================================= */

function clearUpload(){

    clearCurrentObject();


    document
    .getElementById(
        "fileInput"
    )
    .value = "";


    document
    .getElementById(
        "productName"
    )
    .textContent =
        "尚未有圖檔";


    document
    .getElementById(
        "productDescription"
    )
    .textContent =
        "請上傳圖檔";


    resetCamera();


    document
    .getElementById(
        "emptyState"
    )
    .style.opacity = "1";


    setStatus(
        "WAITING",
        false
    );

}


/* =========================================================
   顯示載入完成
========================================================= */

function showLoadedState(){

    document
    .getElementById(
        "emptyState"
    )
    .style.opacity = "0";


    setStatus(
        "READY",
        true
    );

}


/* =========================================================
   更新產品資訊
========================================================= */

function updateProductUI(
    name,
    description
){

    document
    .getElementById(
        "productName"
    )
    .textContent =
        name;


    document
    .getElementById(
        "productDescription"
    )
    .textContent =
        description;

}


/* =========================================================
   狀態
========================================================= */

function setStatus(
    text,
    ready
){

    document
    .getElementById(
        "statusText"
    )
    .textContent =
        text;


    document
    .getElementById(
        "statusDot"
    )
    .classList.toggle(
        "ready",
        ready
    );

}


/* =========================================================
   拖曳上傳
========================================================= */

function setupDragDrop(){

    const viewer =
        document.getElementById(
            "viewer"
        );


    viewer.addEventListener(
        "dragover",
        function(e){

            e.preventDefault();

            viewer.classList.add(
                "dragover"
            );

        }
    );


    viewer.addEventListener(
        "dragleave",
        function(){

            viewer.classList.remove(
                "dragover"
            );

        }
    );


    viewer.addEventListener(
        "drop",
        function(e){

            e.preventDefault();

            viewer.classList.remove(
                "dragover"
            );


            const file =
                e.dataTransfer.files[0];


            if(
                file
            ){

                loadFile(
                    file
                );

            }

        }
    );

}

   按鈕事件
========================================================= */

)
.addEventListener(

);


document

document

);


document
.getElementById(

)
.addEventListener(

);


document
.getElementById(

)

);


document
.getElementById(
    "clearBtn"

.addEventListener(

/* =========================================================
   啟動
========================================================= */

init();

</script>

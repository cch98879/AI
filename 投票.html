
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>即時投票應用</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background:
        radial-gradient(circle at top left, #dbeafe 0, transparent 35%),
        radial-gradient(circle at bottom right, #ede9fe 0, transparent 35%),
        #f5f7fb;
    color: #1f2937;
}

.container {
    width: min(900px, 94%);
    margin: 40px auto;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 42px);
    color: #111827;
}

.header p {
    margin-top: 10px;
    color: #6b7280;
}

.card {
    background: rgba(255,255,255,.94);
    border-radius: 24px;
    padding: 28px;
    margin-bottom: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,.08);
    border: 1px solid rgba(255,255,255,.8);
}

.section-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 18px;
}

input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    transition: .2s;
}

input[type="text"]:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 4px rgba(99,102,241,.12);
}

.option-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
}

.option-row input {
    flex: 1;
}

.remove-btn {
    width: 46px;
    border: 0;
    border-radius: 12px;
    background: #fee2e2;
    color: #dc2626;
    font-size: 20px;
    cursor: pointer;
}

.remove-btn:hover {
    background: #fecaca;
}

button {
    border: 0;
    cursor: pointer;
    font-family: inherit;
    transition: .2s;
}

.add-option {
    padding: 11px 16px;
    border-radius: 10px;
    background: #eef2ff;
    color: #4f46e5;
    font-weight: 700;
    margin-top: 4px;
}

.add-option:hover {
    background: #e0e7ff;
}

.primary-btn {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    border-radius: 12px;
    background: #4f46e5;
    color: white;
    font-size: 17px;
    font-weight: 700;
}

.primary-btn:hover {
    background: #4338ca;
    transform: translateY(-1px);
}

.vote-question {
    font-size: clamp(22px, 4vw, 30px);
    font-weight: 800;
    margin-bottom: 25px;
    line-height: 1.4;
}

.vote-option {
    position: relative;
    padding: 17px 18px;
    margin-bottom: 12px;
    border: 2px solid #e5e7eb;
    border-radius: 15px;
    background: white;
    cursor: pointer;
    transition: .2s;
}

.vote-option:hover:not(.disabled) {
    border-color: #818cf8;
    transform: translateX(3px);
}

.vote-option.selected {
    border-color: #6366f1;
    background: #eef2ff;
    box-shadow: 0 0 0 3px rgba(99,102,241,.08);
}

.vote-option.disabled {
    cursor: not-allowed;
    opacity: .75;
}

.vote-option input {
    display: none;
}

.option-content {
    display: flex;
    align-items: center;
    gap: 13px;
}

.radio {
    width: 22px;
    height: 22px;
    border: 2px solid #9ca3af;
    border-radius: 50%;
    flex-shrink: 0;
    position: relative;
}

.selected .radio {
    border-color: #4f46e5;
}

.selected .radio::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    background: #4f46e5;
    border-radius: 50%;
    left: 4px;
    top: 4px;
}

.option-name {
    font-weight: 600;
    font-size: 16px;
}

.vote-action {
    display: flex;
    justify-content: center;
    margin-top: 20px;
}

.vote-btn {
    min-width: 180px;
    padding: 13px 25px;
    border-radius: 12px;
    background: #10b981;
    color: white;
    font-weight: 700;
    font-size: 16px;
}

.vote-btn:hover:not(:disabled) {
    background: #059669;
    transform: translateY(-1px);
}

.vote-btn:disabled {
    background: #d1d5db;
    cursor: not-allowed;
}

.status {
    text-align: center;
    margin: 15px 0 0;
    color: #6b7280;
    font-size: 14px;
}

.results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
    flex-wrap: wrap;
}

.total-votes {
    background: #f3f4f6;
    padding: 8px 14px;
    border-radius: 20px;
    font-weight: 700;
    color: #4b5563;
}

.result-item {
    margin-bottom: 20px;
}

.result-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 10px;
}

.result-name {
    font-weight: 700;
}

.result-percent {
    font-weight: 800;
    color: #4f46e5;
}

.bar-bg {
    width: 100%;
    height: 30px;
    background: #eef0f5;
    border-radius: 15px;
    overflow: hidden;
}

.bar {
    width: 0%;
    height: 100%;
    border-radius: 15px;
    background: linear-gradient(90deg, #6366f1, #8b5cf6);
    transition: width .8s cubic-bezier(.22,1,.36,1);
    position: relative;
}

.bar::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.25),
        transparent
    );
    animation: shine 1.5s infinite;
}

@keyframes shine {
    from {
        transform: translateX(-100%);
    }
    to {
        transform: translateX(100%);
    }
}

.result-count {
    margin-top: 6px;
    font-size: 13px;
    color: #6b7280;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 25px;
    flex-wrap: wrap;
}

.secondary-btn,
.danger-btn {
    flex: 1;
    min-width: 150px;
    padding: 13px;
    border-radius: 11px;
    font-weight: 700;
}

.secondary-btn {
    background: #eef2ff;
    color: #4f46e5;
}

.secondary-btn:hover {
    background: #e0e7ff;
}

.danger-btn {
    background: #fef2f2;
    color: #dc2626;
}

.danger-btn:hover {
    background: #fee2e2;
}

.hidden {
    display: none;
}

.badge {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 20px;
    background: #dcfce7;
    color: #15803d;
    font-size: 13px;
    font-weight: 700;
    margin-left: 5px;
}

.empty {
    text-align: center;
    color: #9ca3af;
    padding: 30px 0;
}

@media (max-width: 600px) {
    .container {
        margin: 20px auto;
    }

    .card {
        padding: 20px;
        border-radius: 18px;
    }

    .option-row {
        gap: 7px;
    }

    .remove-btn {
        width: 42px;
    }

    .actions {
        flex-direction: column;
    }

    .secondary-btn,
    .danger-btn {
        width: 100%;
    }

    .results-header {
        align-items: flex-start;
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🗳️ 即時投票</h1>
        <p>建立你的問題，立即看看大家的選擇</p>
    </div>

    <!-- 建立投票 -->
    <div class="card" id="createCard">

        <div class="section-title">建立新的投票</div>

        <input
            type="text"
            id="questionInput"
            placeholder="例如：你最喜歡哪一種 AI 工具？"
        >

        <div style="margin-top:20px;">
            <div class="section-title">投票選項</div>

            <div id="optionsContainer"></div>

            <button class="add-option" onclick="addOption()">
                ＋ 新增選項
            </button>
        </div>

        <button class="primary-btn" onclick="createPoll()">
            🚀 建立投票
        </button>

    </div>


    <!-- 投票區 -->
    <div class="card hidden" id="voteCard">

        <div class="vote-question" id="voteQuestion"></div>

        <div id="voteOptions"></div>

        <div class="vote-action">
            <button
                class="vote-btn"
                id="voteButton"
                onclick="submitVote()"
                disabled
            >
                請先選擇一個選項
            </button>
        </div>

        <div class="status" id="voteStatus">
            每人只能投票一次
        </div>

    </div>


    <!-- 結果 -->
    <div class="card hidden" id="resultCard">

        <div class="results-header">
            <div class="section-title" style="margin:0;">
                📊 即時投票結果
            </div>

            <div class="total-votes">
                總投票數：
                <span id="totalVotes">0</span>
            </div>
        </div>

        <div id="results"></div>

        <div class="actions">

            <button class="secondary-btn" onclick="resetVote()">
                🔄 重置投票
            </button>

            <button class="secondary-btn" onclick="newPoll()">
                ✨ 建立新投票
            </button>

        </div>

    </div>

</div>


<script>

let poll = null;
let selectedIndex = null;

const STORAGE_KEY = "realtime_poll_app";


/* =========================
   初始化
========================= */

document.addEventListener("DOMContentLoaded", () => {

    loadPoll();

    if (!poll) {
        addOption();
        addOption();
        addOption();
    }

});


/* =========================
   新增選項
========================= */

function addOption(value = "") {

    const container =
        document.getElementById("optionsContainer");

    const row = document.createElement("div");

    row.className = "option-row";

    row.innerHTML = `
        <input
            type="text"
            class="option-input"
            placeholder="輸入投票選項"
            value="${escapeHTML(value)}"
        >

        <button
            class="remove-btn"
            onclick="removeOption(this)"
            title="刪除選項"
        >
            ×
        </button>
    `;

    container.appendChild(row);
}


/* =========================
   刪除選項
========================= */

function removeOption(button) {

    const container =
        document.getElementById("optionsContainer");

    if (container.children.length <= 2) {
        alert("至少需要 2 個投票選項！");
        return;
    }

    button.parentElement.remove();

}


/* =========================
   建立投票
========================= */

function createPoll() {

    const question =
        document.getElementById("questionInput").value.trim();

    const inputs =
        document.querySelectorAll(".option-input");

    const options = [];

    inputs.forEach(input => {

        const value = input.value.trim();

        if (value) {
            options.push({
                name: value,
                votes: 0
            });
        }

    });


    if (!question) {
        alert("請輸入投票問題！");
        return;
    }

    if (options.length < 2) {
        alert("至少需要 2 個有效的投票選項！");
        return;
    }


    poll = {
        question: question,
        options: options,
        hasVoted: false
    };

    selectedIndex = null;

    savePoll();

    showPoll();

}


/* =========================
   顯示投票
========================= */

function showPoll() {

    document
        .getElementById("createCard")
        .classList.add("hidden");

    document
        .getElementById("voteCard")
        .classList.remove("hidden");

    document
        .getElementById("resultCard")
        .classList.remove("hidden");


    document.getElementById("voteQuestion")
        .textContent = poll.question;


    renderVoteOptions();

    renderResults();

}


/* =========================
   投票選項
========================= */

function renderVoteOptions() {

    const container =
        document.getElementById("voteOptions");

    container.innerHTML = "";

    poll.options.forEach((option, index) => {

        const div = document.createElement("div");

        div.className = "vote-option";

        if (selectedIndex === index) {
            div.classList.add("selected");
        }

        if (poll.hasVoted) {
            div.classList.add("disabled");
        }

        div.innerHTML = `
            <div class="option-content">

                <div class="radio"></div>

                <div class="option-name">
                    ${escapeHTML(option.name)}
                </div>

            </div>
        `;


        if (!poll.hasVoted) {

            div.addEventListener("click", () => {

                selectedIndex = index;

                renderVoteOptions();

                const btn =
                    document.getElementById("voteButton");

                btn.disabled = false;

                btn.textContent = "🗳️ 確認投票";

            });

        }

        container.appendChild(div);

    });


    if (poll.hasVoted) {

        const btn =
            document.getElementById("voteButton");

        btn.disabled = true;

        btn.textContent = "✓ 已完成投票";

        document.getElementById("voteStatus")
            .innerHTML =
            `你已完成投票 <span class="badge">已投票</span>`;

    }

}


/* =========================
   送出投票
========================= */

function submitVote() {

    if (poll.hasVoted) {
        return;
    }

    if (selectedIndex === null) {
        return;
    }


    poll.options[selectedIndex].votes++;

    poll.hasVoted = true;

    savePoll();

    renderVoteOptions();

    renderResults();

}


/* =========================
   顯示結果
========================= */

function renderResults() {

    const container =
        document.getElementById("results");

    const total =
        poll.options.reduce(
            (sum, option) => sum + option.votes,
            0
        );


    document.getElementById("totalVotes")
        .textContent = total;


    container.innerHTML = "";


    poll.options.forEach(option => {

        const percent =
            total === 0
            ? 0
            : (option.votes / total) * 100;


        const item =
            document.createElement("div");

        item.className = "result-item";

        item.innerHTML = `

            <div class="result-top">

                <span class="result-name">
                    ${escapeHTML(option.name)}
                </span>

                <span class="result-percent">
                    ${percent.toFixed(1)}%
                </span>

            </div>

            <div class="bar-bg">

                <div
                    class="bar"
                    style="width: ${percent}%"
                ></div>

            </div>

            <div class="result-count">
                ${option.votes} 票
            </div>

        `;

        container.appendChild(item);

    });

}


/* =========================
   重置投票
========================= */

function resetVote() {

    if (!poll) return;

    const confirmReset =
        confirm("確定要將所有投票數歸零嗎？");

    if (!confirmReset) {
        return;
    }


    poll.options.forEach(option => {
        option.votes = 0;
    });

    poll.hasVoted = false;

    selectedIndex = null;

    savePoll();

    renderVoteOptions();

    renderResults();

    document.getElementById("voteStatus")
        .textContent = "每人只能投票一次";

}


/* =========================
   建立新投票
========================= */

function newPoll() {

    const confirmNew =
        confirm("建立新投票後，目前的投票資料會被清除，確定嗎？");

    if (!confirmNew) {
        return;
    }


    localStorage.removeItem(STORAGE_KEY);

    poll = null;

    selectedIndex = null;


    document
        .getElementById("voteCard")
        .classList.add("hidden");

    document
        .getElementById("resultCard")
        .classList.add("hidden");

    document
        .getElementById("createCard")
        .classList.remove("hidden");


    document.getElementById("questionInput")
        .value = "";

    document.getElementById("optionsContainer")
        .innerHTML = "";


    addOption();
    addOption();
    addOption();

}


/* =========================
   LocalStorage
========================= */

function savePoll() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(poll)
    );

}


function loadPoll() {

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if (!saved) {
        return;
    }

    try {

        poll = JSON.parse(saved);

        showPoll();

    } catch (error) {

        localStorage.removeItem(STORAGE_KEY);

    }

}


/* =========================
   HTML 安全處理
========================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>彰化社區大學隨機抽獎系統</title>
  <style>
    :root{
      --bg1:#0b0f1a; --bg2:#111827; --card:#0f172a; --accent:#22d3ee; --accent-2:#60a5fa; --text:#e5e7eb; --muted:#94a3b8; --danger:#f43f5e;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family: "Noto Sans TC", system-ui, -apple-system, Segoe UI, Roboto, Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      color:var(--text);
      background: radial-gradient(1200px 600px at 20% -10%, rgba(34,211,238,.15), transparent 60%),
                  radial-gradient(1000px 500px at 120% 10%, rgba(96,165,250,.12), transparent 55%),
                  linear-gradient(160deg, var(--bg1), var(--bg2));
      min-height:100svh; display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .wrap{width:clamp(320px, 95vw, 1100px);}
    .title{
      font-weight:800; letter-spacing:.08em; text-align:center;
      font-size:clamp(24px, 4vw, 40px); margin:8px 0 16px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip:text; background-clip:text; color:transparent;
      text-shadow:0 0 24px rgba(34,211,238,.35);
    }
    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.0));
      border:1px solid rgba(148,163,184,.2);
      border-radius:18px; padding:16px; backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(15,23,42,.4), inset 0 0 20px rgba(34,211,238,.06);
    }
    .controls{ display:grid; grid-template-columns: repeat(12, 1fr); gap:12px; align-items:end; }
    .ctrl{ grid-column: span 12; }
    @media (min-width:640px){
      .ctrl.span4{ grid-column: span 4; }
      .ctrl.span2{ grid-column: span 2; }
      .ctrl.span3{ grid-column: span 3; }
      .ctrl.span5{ grid-column: span 5; }
    }
    label{ display:block; font-size:14px; color:var(--muted); margin-bottom:6px; }
    input[type="number"]{
      width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(148,163,184,.25);
      background:rgba(2,6,23,.6); color:var(--text); font-size:16px;
      outline:none; transition: border .2s, box-shadow .2s;
    }
    input[type="number"]:focus{
      border-color: var(--accent); box-shadow: 0 0 0 4px rgba(34,211,238,.15);
    }
    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      padding:12px 16px; border-radius:12px; border:1px solid rgba(148,163,184,.25);
      background: linear-gradient(180deg, rgba(34,211,238,.18), rgba(34,211,238,.08));
      color: var(--text); font-weight:700; letter-spacing:.05em; cursor:pointer;
      transition: transform .08s ease, filter .2s ease, box-shadow .2s ease, background .2s ease;
      box-shadow: 0 10px 24px rgba(34,211,238,.12), inset 0 0 18px rgba(96,165,250,.10);
      user-select:none;
    }
    .btn:hover{ filter:brightness(1.1); }
    .btn:active{ transform: translateY(1px) scale(.99); }
    .btn.secondary{
      background: linear-gradient(180deg, rgba(96,165,250,.18), rgba(96,165,250,.08));
    }
    .btn.danger{
      background: linear-gradient(180deg, rgba(244,63,94,.2), rgba(244,63,94,.08));
      border-color: rgba(244,63,94,.35);
    }
    .status{
      display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
      padding:10px 12px; border-radius:12px; background:rgba(2,6,23,.35);
      border:1px dashed rgba(148,163,184,.3); margin-top:12px; font-size:15px;
    }
    .badge{ padding:6px 10px; border-radius:999px; font-weight:700; letter-spacing:.04em;
      background:rgba(34,211,238,.12); border:1px solid rgba(34,211,238,.35);
      box-shadow: inset 0 0 12px rgba(34,211,238,.15);
    }

    .grid{ margin-top:18px; display:grid; grid-template-columns: repeat(10, 1fr); gap:8px; }
    .cell{
      position:relative; aspect-ratio: 1/1; display:flex; align-items:center; justify-content:center;
      font-weight:800; font-size:clamp(16px,2.1vw,22px); color:#cbd5e1;
      border-radius:14px; border:1px solid rgba(148,163,184,.22);
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.0));
      box-shadow: inset 0 0 24px rgba(15,23,42,.65);
      transition: transform .08s ease, box-shadow .2s ease, border-color .2s ease, color .2s ease;
      overflow:hidden;
    }
    .cell::before{
      content:""; position:absolute; inset:-1px; border-radius:inherit;
      background: radial-gradient(250px 250px at 50% -20%, rgba(34,211,238,.18), transparent 60%);
      opacity:.0; transition: opacity .2s ease;
    }
    .cell:hover{ transform: translateY(-1px); }

    .cell.active{
      color:#0b1220; border-color: rgba(34,211,238,.9);
      background: linear-gradient(180deg, rgba(34,211,238,.85), rgba(96,165,250,.85));
      box-shadow: 0 0 20px rgba(34,211,238,.6), 0 0 40px rgba(96,165,250,.30), inset 0 0 30px rgba(255,255,255,.35);
    }
    .cell.active::before{ opacity: .6; }

    .footer{ text-align:center; color:var(--muted); margin-top:16px; font-size:13px; }
    .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="title">彰化社區大學隨機抽獎系統-李信賢設計</h1>
    <section class="panel">
      <div class="controls">
        <div class="ctrl span4">
          <label for="count">抽獎儲存格數量（1–500，預設 20）</label>
          <input type="number" id="count" min="1" max="500" value="20" inputmode="numeric" />
        </div>
        <div class="ctrl span3">
          <label for="seconds">倒數秒數（1–60，預設 5）</label>
          <input type="number" id="seconds" min="1" max="60" value="5" inputmode="numeric" />
        </div>
        <div class="ctrl span2">
          <button id="setupBtn" class="btn" type="button" title="根據設定生成抽獎格">⚙️ 設定</button>
        </div>
        <div class="ctrl span3">
          <button id="startBtn" class="btn secondary" type="button" title="開始隨機抽選">▶ 開始抽獎</button>
        </div>
      </div>

      <div class="status" aria-live="polite">
        <div>倒數：<span id="countdown" class="badge">—</span></div>
        <div>最終中獎號碼：<span id="winner" class="badge">—</span></div>
      </div>

      <div id="grid" class="grid" role="grid" aria-label="抽獎格"></div>
      <p class="footer">每列最多 10 格；抽獎進行時每 0.1 秒更新一次高亮。</p>
      <span id="live" class="sr-only" aria-live="assertive"></span>
    </section>
  </main>

  <script>
    const $ = (sel) => document.querySelector(sel);
    const grid = $('#grid');
    const setupBtn = $('#setupBtn');
    const startBtn = $('#startBtn');
    const countdownEl = $('#countdown');
    const winnerEl = $('#winner');
    const liveEl = $('#live');

    let spinTimer = null; // 0.1 秒輪播計時器
    let countdownTimer = null; // 倒數顯示計時器
    let running = false; // 是否正在抽獎
    let lastActive = null; // 上一次高亮的元素

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

    function buildGrid(total){
      grid.innerHTML = '';
      const frag = document.createDocumentFragment();
      for(let i=1; i<=total; i++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.role = 'gridcell';
        cell.dataset.value = String(i);
        cell.textContent = i;
        frag.appendChild(cell);
      }
      grid.appendChild(frag);
      winnerEl.textContent = '—';
      countdownEl.textContent = '—';
    }

    function randomCell(){
      const cells = grid.children;
      if(!cells.length) return null;
      const idx = Math.floor(Math.random() * cells.length);
      return cells[idx];
    }

    function highlight(cell){
      if(lastActive){ lastActive.classList.remove('active'); }
      if(cell){ cell.classList.add('active'); lastActive = cell; }
    }

    function setControlsDisabled(disabled){
      $('#count').disabled = disabled;
      $('#seconds').disabled = disabled;
      setupBtn.disabled = disabled;
      startBtn.disabled = disabled;
      startBtn.style.cursor = disabled ? 'not-allowed' : 'pointer';
    }

    setupBtn.addEventListener('click', () => {
      if(running) return; // 抽獎中不允許重設
      let total = parseInt($('#count').value, 10);
      let secs = parseFloat($('#seconds').value);
      if(Number.isNaN(total)) total = 20;
      if(Number.isNaN(secs)) secs = 5;
      total = clamp(total, 1, 500);
      secs = clamp(secs, 1, 60);
      $('#count').value = total;
      $('#seconds').value = secs;
      buildGrid(total);
    });

    startBtn.addEventListener('click', () => {
      if(running) return;
      if(!grid.children.length){
        // 若尚未建立，依預設建立
        buildGrid(clamp(parseInt($('#count').value,10)||20,1,500));
      }
      const secs = clamp(parseFloat($('#seconds').value)||5, 1, 60);

      running = true;
      setControlsDisabled(true);
      const endAt = performance.now() + secs * 1000;

      // 0.1 秒輪播高亮
      spinTimer = setInterval(() => {
        const c = randomCell();
        if(c) highlight(c);
      }, 100);

      // 倒數顯示（每 100ms 更新一次，顯示到 0.0）
      countdownTimer = setInterval(() => {
        const remain = Math.max(0, endAt - performance.now());
        const sec10 = Math.round(remain / 100); // 0.1 秒為單位
        countdownEl.textContent = (sec10/10).toFixed(1) + ' 秒';
        if(remain <= 0){
          finish();
        }
      }, 100);

      function finish(){
        clearInterval(spinTimer); spinTimer = null;
        clearInterval(countdownTimer); countdownTimer = null;
        running = false;
        setControlsDisabled(false);
        const finalCell = lastActive || randomCell();
        if(finalCell){
          finalCell.classList.add('active');
          const val = finalCell.dataset.value;
          winnerEl.textContent = '#' + val;
          liveEl.textContent = `中獎號碼為 ${val}`;
        }
      }
    });

    // 載入即建立預設格
    document.addEventListener('DOMContentLoaded', () => buildGrid(20));
  </script>
</body>
</html>

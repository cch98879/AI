
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>讓AI解決我的生活大小事_LINE貼圖裁切器</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: #f1f4fa;
    color: #26334a;
}

header {
    background: linear-gradient(120deg, #243b64, #5378bd);
    color: white;
    text-align: center;
    padding: 23px 12px;
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 1px;
}

.container {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    gap: 20px;
    padding: 22px;
    max-width: 1600px;
    margin: auto;
}

.panel {
    background: white;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 3px 15px #23334d12;
    min-width: 0;
}

h3 {
    margin: 0 0 18px;
    padding-bottom: 12px;
    border-bottom: 2px solid #edf0f6;
    color: #34578e;
}

.section {
    margin-bottom: 25px;
}

.section label {
    display: block;
    font-weight: bold;
    margin-bottom: 10px;
}

input[type=file] {
    width: 100%;
    padding: 12px;
    background: #f5f7fb;
    border: 1px dashed #9eafd0;
    border-radius: 8px;
}

.grid-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.grid-options button {
    background: #edf2fa;
    color: #34578e;
    border: 1px solid #d6dfef;
    padding: 13px 5px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.grid-options button.active {
    background: #345f9f;
    color: white;
    border-color: #345f9f;
}

button {
    font-family: inherit;
    transition: .2s;
}

button:hover {
    filter: brightness(.94);
}

.primary {
    width: 100%;
    background: #345f9f;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.download-all {
    width: 100%;
    background: #15976d;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.secondary {
    width: 100%;
    background: #e9edf4;
    color: #45566f;
    border: none;
    padding: 11px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 9px;
}

.info {
    font-size: 13px;
    color: #8490a4;
    line-height: 1.7;
    margin-top: 10px;
}

.preview-original {
    background: #f6f8fc;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    margin-bottom: 22px;
}

.preview-original img {
    max-width: 100%;
    max-height: 280px;
    object-fit: contain;
}

.preview-original .empty {
    color: #a4aec0;
    padding: 65px 10px;
}

.original-info {
    font-size: 13px;
    color: #75839a;
    margin-top: 8px;
}

.result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 15px;
}

.result-header h3 {
    margin: 0;
    border: none;
    padding: 0;
}

.result-count {
    color: #71819c;
    font-size: 13px;
}

.result-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 13px;
}

.sticker-card {
    border: 1px solid #e5eaf2;
    border-radius: 10px;
    overflow: hidden;
    background: white;
    min-width: 0;
}

.sticker-number {
    background: #f0f3f9;
    padding: 8px;
    font-size: 13px;
    font-weight: bold;
    color: #526b91;
}

.sticker-image {
    background-color: #fff;
    background-image:
        linear-gradient(45deg, #e9e9e9 25%, transparent 25%),
        linear-gradient(-45deg, #e9e9e9 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e9e9e9 75%),
        linear-gradient(-45deg, transparent 75%, #e9e9e9 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    display: flex;
    justify-content: center;
    align-items: center;
    aspect-ratio: 1;
    padding: 8px;
}

.sticker-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.sticker-footer {
    padding: 8px;
}

.sticker-footer button {
    width: 100%;
    border: none;
    background: #eaf2ff;
    color: #345f9f;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
}

.empty-result {
    text-align: center;
    color: #a1aabb;
    background: #f7f9fc;
    border-radius: 10px;
    padding: 65px 10px;
}

@media(max-width:850px) {
    .container {
        grid-template-columns: 1fr;
    }

    .result-grid {
        grid-template-columns: repeat(3, minmax(0,1fr));
    }
}

@media(max-width:480px) {
    header {
        font-size: 19px;
    }

    .container {
        padding: 10px;
    }

    .result-grid {
        grid-template-columns: repeat(2, minmax(0,1fr));
    }
}
</style>
</head>

<body>

<header>
    讓AI解決我的生活大小事_LINE貼圖裁切器
</header>

<div class="container">

    <!-- 左側操作介面 -->
    <div class="panel">

        <h3>⚙️ 操作介面</h3>

        <div class="section">
            <label>① 上傳原始圖片</label>
            <input type="file" id="upload" accept="image/*">
            <div class="info">
                支援 JPG、PNG、WEBP 格式。<br>
                建議使用排列整齊的貼圖圖片。
            </div>
        </div>

        <div class="section">
            <label>② 選擇切割張數</label>

            <div class="grid-options">
                <button class="active" data-grid="2">
                    4 格<br>2 × 2
                </button>

                <button data-grid="3">
                    9 格<br>3 × 3
                </button>

                <button data-grid="4">
                    16 格<br>4 × 4
                </button>
            </div>

            <div class="info">
                依照原始圖片的寬度與高度平均切割。
            </div>
        </div>

        <div class="section">
            <label>③ 背景處理</label>
            <label style="font-weight:normal">
                <input type="checkbox" id="removeWhite" checked>
                自動去除綠色（#00FF00）及所有相近顏色背景
            </label>
            <div class="info">
                將 #00FF00 及所有相近綠色轉換為透明背景，保留貼圖內容。
            </div>
        </div>

        <div class="section">
            <button class="primary" id="cutBtn">
                ✂️ 開始切割圖片
            </button>

            <button class="download-all" id="downloadAll">
                ↓ 一鍵下載全部圖片
            </button>

            <button class="secondary" id="resetBtn">
                清除並重新開始
            </button>

            <div class="info" id="status">
                請先上傳圖片，再選擇切割張數。
            </div>
        </div>

    </div>

    <!-- 右側顯示介面 -->
    <div class="panel">

        <h3>🖼️ 圖片預覽</h3>

        <div class="preview-original">
            <div style="font-weight:bold;margin-bottom:12px">
                原始上傳圖片
            </div>

            <div id="originalEmpty" class="empty">
                尚未上傳圖片
            </div>

            <img id="originalImg" style="display:none">

            <div class="original-info" id="imageInfo"></div>
        </div>

        <div class="result-header">
            <h3>✂️ 切割後的 LINE 貼圖</h3>
            <span class="result-count" id="resultCount">
                尚未切割
            </span>
        </div>

        <div id="resultGrid" class="result-grid">
            <div class="empty-result" style="grid-column:1/-1">
                切割後的圖片將顯示在這裡
            </div>
        </div>

    </div>

</div>

<script>

let originalImage = null;
let selectedGrid = 2;
let stickers = [];
let originalFileName = "sticker";

// 上傳圖片
document.getElementById("upload").addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        alert("請選擇圖片檔案！");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {

        const img = new Image();

        img.onload = function() {

            originalImage = img;

            originalFileName = file.name.replace(/\.[^.]+$/, "");

            document.getElementById("originalImg").src = event.target.result;

            document.getElementById("originalImg").style.display = "block";

            document.getElementById("originalEmpty").style.display = "none";

            document.getElementById("imageInfo").textContent =
                "圖片尺寸：" + img.width + " × " + img.height + " px";

            document.getElementById("status").textContent =
                "圖片上傳成功！可以開始切割。";

            clearResults();
        };

        img.src = event.target.result;

    };

    reader.readAsDataURL(file);

});

// 選擇切割張數
document.querySelectorAll(".grid-options button").forEach(button => {

    button.addEventListener("click", function() {

        document.querySelectorAll(".grid-options button").forEach(b => {
            b.classList.remove("active");
        });

        this.classList.add("active");

        selectedGrid = Number(this.dataset.grid);

        clearResults();

    });

});

// 去除 #00FF00 及所有相近綠色背景
function removeWhiteBackground(canvas) {

    const ctx = canvas.getContext("2d", {
        willReadFrequently: true
    });

    const imageData = ctx.getImageData(
        0, 0, canvas.width, canvas.height
    );

    const data = imageData.data;

    // 以 #00FF00（RGB 0,255,0）為基準
    // 容許距離越大，去除的相近綠色範圍越廣
    const greenTolerance = 120;
    const greenToleranceSquared = greenTolerance * greenTolerance;

    for (let i = 0; i < data.length; i += 4) {

        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        // 計算目前像素與 #00FF00 的 RGB 顏色距離
        const distanceSquared =
            (r * r) +
            ((g - 255) * (g - 255)) +
            (b * b);

        // 純綠色及設定範圍內的相近綠色全部轉為透明
        if (distanceSquared <= greenToleranceSquared) {
            data[i + 3] = 0;
        }
    }

    ctx.putImageData(imageData, 0, 0);

}

// 開始切割
document.getElementById("cutBtn").addEventListener("click", function() {

    if (!originalImage) {
        alert("請先上傳圖片！");
        return;
    }

    const rows = selectedGrid;
    const cols = selectedGrid;

    const width = originalImage.width;
    const height = originalImage.height;

    const removeWhite = document.getElementById("removeWhite").checked;

    stickers = [];

    const grid = document.getElementById("resultGrid");

    grid.innerHTML = "";

    grid.style.gridTemplateColumns =
        `repeat(${cols}, minmax(0, 1fr))`;

    let index = 0;

    for (let row = 0; row < rows; row++) {

        for (let col = 0; col < cols; col++) {

            index++;

            // 以原始圖片尺寸平均分割
            const x1 = Math.round(col * width / cols);
            const y1 = Math.round(row * height / rows);

            const x2 = Math.round((col + 1) * width / cols);
            const y2 = Math.round((row + 1) * height / rows);

            const cropWidth = x2 - x1;
            const cropHeight = y2 - y1;

            const canvas = document.createElement("canvas");

            canvas.width = cropWidth;
            canvas.height = cropHeight;

            const ctx = canvas.getContext("2d");

            ctx.drawImage(
                originalImage,
                x1, y1,
                cropWidth, cropHeight,
                0, 0,
                cropWidth, cropHeight
            );

            if (removeWhite) {
                removeWhiteBackground(canvas);
            }

            const imageURL = canvas.toDataURL("image/png");

            stickers.push({
                name: originalFileName + "_" +
                    String(index).padStart(2, "0") + ".png",
                url: imageURL
            });

            // 建立預覽卡片
            const card = document.createElement("div");

            card.className = "sticker-card";

            const number = document.createElement("div");
            number.className = "sticker-number";
            number.textContent = "貼圖 " + index;

            const imageBox = document.createElement("div");
            imageBox.className = "sticker-image";

            const img = document.createElement("img");
            img.src = imageURL;

            imageBox.appendChild(img);

            const footer = document.createElement("div");
            footer.className = "sticker-footer";

            const downloadBtn = document.createElement("button");
            downloadBtn.textContent = "↓ 下載圖片";

            downloadBtn.addEventListener("click", function() {
                downloadImage(stickers[index - 1]);
            });

            footer.appendChild(downloadBtn);

            card.appendChild(number);
            card.appendChild(imageBox);
            card.appendChild(footer);

            grid.appendChild(card);

        }

    }

    document.getElementById("resultCount").textContent =
        "共 " + stickers.length + " 張圖片";

    document.getElementById("status").textContent =
        "切割完成！共產生 " + stickers.length + " 張 PNG 圖片。";

});

// 單張下載
function downloadImage(item) {

    const link = document.createElement("a");

    link.href = item.url;
    link.download = item.name;

    document.body.appendChild(link);
    link.click();
    link.remove();

}

// 一鍵下載全部圖片（不使用 ZIP）
document.getElementById("downloadAll").addEventListener("click", async function() {

    if (stickers.length === 0) {
        alert("請先完成圖片切割！");
        return;
    }

    const button = this;

    button.disabled = true;

    try {

        for (let i = 0; i < stickers.length; i++) {

            downloadImage(stickers[i]);

            document.getElementById("status").textContent =
                "下載中：" + (i + 1) + " / " + stickers.length;

            // 稍微間隔，避免瀏覽器阻擋連續下載
            await new Promise(resolve => setTimeout(resolve, 350));

        }

        document.getElementById("status").textContent =
            "全部 " + stickers.length + " 張圖片已送出下載！";

    } finally {

        button.disabled = false;

    }

});

// 清除切割結果
function clearResults() {

    stickers = [];

    document.getElementById("resultGrid").innerHTML =
        '<div class="empty-result" style="grid-column:1/-1">' +
        '請按「開始切割圖片」產生貼圖' +
        '</div>';

    document.getElementById("resultCount").textContent =
        "尚未切割";

}

// 重置
document.getElementById("resetBtn").addEventListener("click", function() {

    originalImage = null;
    stickers = [];

    document.getElementById("upload").value = "";

    document.getElementById("originalImg").style.display = "none";

    document.getElementById("originalEmpty").style.display = "block";

    document.getElementById("imageInfo").textContent = "";

    document.getElementById("status").textContent =
        "請先上傳圖片，再選擇切割張數。";

    clearResults();

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>讓AI解決我的生活大小事_GitHUB檔案瀏覽器</title>
<style>
/* ================================
   整體頁面
   ================================ */
body {
    font-family:
        Arial,
        "Noto Sans TC",
        sans-serif;
    background: #f5f7fa;
    margin: 0;
    padding: 20px;
}
/* ================================
   主容器
   ================================ */
.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.1);
}
/* ================================
   標題
   ================================ */
h1 {
    text-align: center;
    margin-bottom: 10px;
}
/* ================================
   儲存庫資訊
   ================================ */
.info {
    text-align: center;
    color: #666;
    margin-bottom: 20px;
}
/* ================================
   工具列
   ================================ */
.toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}
button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #24292f;
    color: white;
    font-size: 15px;
}
button:hover {
    opacity: 0.8;
}
/* ================================
   目前路徑
   ================================ */
.path {
    background: #f0f2f5;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    font-weight: bold;
}
/* ================================
   檔案列
   ================================ */
.file {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px;
    border-bottom:
        1px solid #eee;
}
.file:hover {
    background: #f8f9fa;
}
/* ================================
   檔案名稱
   ================================ */
.name {
    font-size: 16px;
    cursor: pointer;
}
.folder {
    font-weight: bold;
}
/* ================================
   檔案類型
   ================================ */
.type {
    color: #888;
    font-size: 13px;
    margin-left: 10px;
}
/* ================================
   開啟連結
   ================================ */
a {
    text-decoration: none;
    color: #0969da;
    font-weight: bold;
}
/* ================================
   載入中
   ================================ */
.loading {
    text-align: center;
    padding: 30px;
    color: #777;
}
/* ================================
   錯誤訊息
   ================================ */
.error {
    color: red;
    text-align: center;
    padding: 20px;
}
/* ================================
   手機版
   ================================ */
@media (max-width: 600px) {
    body {
        padding: 10px;
    }
    .container {
        padding: 15px;
    }
    .file {
        padding: 12px 5px;
    }
    .name {
        font-size: 14px;
    }
}
</style>
</head>
<body>
<div class="container">
    <!-- ================================
         標題
         ================================ -->
    <h1>
        📦 讓AI解決我的生活大小事_GitHU檔案瀏覽器
    </h1>
    <!-- ================================
         儲存庫資訊
         ================================ -->
    <div class="info">
        儲存庫：
        <strong id="repoName"></strong>
        分支：
        <strong id="branchName"></strong>
    </div>
    <!-- ================================
         按鈕
         ================================ -->
    <div class="toolbar">
        <button onclick="loadFiles()">
            🔄 重新整理
        </button>
    </div>
    <!-- ================================
         目前路徑
         ================================ -->
    <div class="path"
         id="currentPath">

        📁 /

    </div>
    <!-- ================================
         檔案清單
         ================================ -->
    <div id="fileList">
        <div class="loading">
            正在讀取 GitHub 檔案……
        </div>
    </div>
</div>
<script>
/* =========================================
   ★★★ GitHub 儲存庫設定 ★★★
   ========================================= */
const GITHUB_USER =
    "cch98879";


const GITHUB_REPO =
    "AI";


const GITHUB_BRANCH =
    "main";
/* =========================================
   ★★★ GitHub Pages 網址 ★★★
   ========================================= */
const GITHUB_PAGES =
    `https://${GITHUB_USER}.github.io/${GITHUB_REPO}/`;
/* =========================================
   目前所在路徑
   ========================================= */
let currentPath = "";
/* =========================================
   瀏覽歷史
   ========================================= */
let historyPath = [];
/* =========================================
   顯示儲存庫名稱
   ========================================= */
document.getElementById("repoName")
    .textContent = GITHUB_REPO;
/* =========================================
   顯示 Branch
   ========================================= */
document.getElementById("branchName")
    .textContent = GITHUB_BRANCH;


/* =========================================
   讀取 GitHub 檔案
   ========================================= */

async function loadFiles(path = currentPath) {


    currentPath = path;


    /* 顯示目前路徑 */

    document.getElementById("currentPath")
        .innerHTML =
        "📁 /" +
        (path || "");


    const fileList =
        document.getElementById("fileList");


    /* 顯示讀取中 */

    fileList.innerHTML =
        '<div class="loading">' +
        '正在讀取 GitHub 檔案……' +
        '</div>';


    /* GitHub API */

    const apiURL =
        `https://api.github.com/repos/` +
        `${GITHUB_USER}/` +
        `${GITHUB_REPO}/contents/` +
        `${path}?ref=${GITHUB_BRANCH}`;


    try {


        const response =
            await fetch(apiURL);


        /* API 錯誤 */

        if (!response.ok) {

            throw new Error(
                "GitHub API 讀取失敗"
            );

        }


        const data =
            await response.json();


        /* 清除原本內容 */

        fileList.innerHTML = "";


        /* ================================
           如果取得的是單一檔案
           ================================ */

        if (!Array.isArray(data)) {

            showFile(data);

            return;

        }


        /* ================================
           排序
           資料夾在前
           檔案在後
           ================================ */

        data.sort(
            (a, b) => {


                /* 同類型 */

                if (a.type === b.type) {

                    return a.name
                        .localeCompare(
                            b.name
                        );

                }


                /* 資料夾優先 */

                return a.type === "dir"
                    ? -1
                    : 1;

            }
        );


        /* ================================
           顯示所有項目
           ================================ */

        data.forEach(
            item => {

                showItem(item);

            }
        );


    }

    catch (error) {


        fileList.innerHTML =

            `<div class="error">

                ❌ 無法讀取 GitHub 檔案

                <br><br>

                ${error.message}

            </div>`;

    }

}


/* =========================================
   顯示檔案 / 資料夾
   ========================================= */

function showItem(item) {


    const div =
        document.createElement("div");


    div.className = "file";


    const left =
        document.createElement("div");


    const name =
        document.createElement("span");


    name.className = "name";


    /* ================================
       資料夾
       ================================ */

    if (item.type === "dir") {


        name.classList.add(
            "folder"
        );


        name.innerHTML =
            "📁 " +
            item.name;


        name.onclick =
            function() {


                /* 記錄目前位置 */

                historyPath.push(
                    currentPath
                );


                /* 進入資料夾 */

                loadFiles(
                    item.path
                );

            };


    }


    /* ================================
       檔案
       ================================ */

    else {


        name.innerHTML =

            getIcon(item.name) +
            " " +
            item.name;


        name.onclick =
            function() {


                /*
                 ★ 直接開啟 GitHub Pages
                 ★ 不開 GitHub 原始碼頁面
                */

                const pageURL =

                    GITHUB_PAGES +
                    item.path;


                window.open(
                    pageURL,
                    "_blank"
                );

            };

    }


    /* 加入名稱 */

    left.appendChild(name);


    /* ================================
       檔案類型
       ================================ */

    const type =
        document.createElement("span");


    type.className = "type";


    type.textContent =

        item.type === "dir"

        ? "資料夾"

        : getFileType(
            item.name
        );


    left.appendChild(type);


    div.appendChild(left);


    /* ================================
       開啟按鈕
       ================================ */

    if (item.type === "file") {


        const link =
            document.createElement("a");


        /*
         ★ GitHub Pages 網址
        */

        link.href =

            GITHUB_PAGES +
            item.path;


        link.target = "_blank";


        link.textContent =
            "開啟";


        div.appendChild(link);

    }


    /* 加入網頁 */

    document
        .getElementById("fileList")
        .appendChild(div);

}


/* =========================================
   顯示單一檔案
   ========================================= */

function showFile(item) {


    const div =
        document.createElement("div");


    div.className = "file";


    /*
     ★ GitHub Pages 網址
    */

    const pageURL =

        GITHUB_PAGES +
        item.path;


    div.innerHTML =

        getIcon(item.name) +

        " " +

        item.name +

        ' <a href="' +

        pageURL +

        '" target="_blank">' +

        '開啟' +

        '</a>';


    document
        .getElementById("fileList")
        .appendChild(div);

}


/* =========================================
   判斷檔案圖示
   ========================================= */

function getIcon(filename) {


    const ext =

        filename
            .split(".")
            .pop()
            .toLowerCase();


    if (
        ext === "html" ||
        ext === "htm"
    )

        return "🌐";


    if (ext === "pdf")

        return "📕";


    if (
        ext === "jpg" ||
        ext === "jpeg" ||
        ext === "png" ||
        ext === "gif" ||
        ext === "webp"
    )

        return "🖼️";


    if (ext === "js")

        return "📜";


    if (ext === "css")

        return "🎨";


    if (ext === "txt")

        return "📄";


    if (
        ext === "doc" ||
        ext === "docx"
    )

        return "📝";


    if (
        ext === "xls" ||
        ext === "xlsx"
    )

        return "📊";


    return "📄";

}


/* =========================================
   顯示檔案類型
   ========================================= */

function getFileType(filename) {


    const ext =

        filename
            .split(".")
            .pop()
            .toLowerCase();


    return ext.toUpperCase() +
           " 檔案";

}


/* =========================================
   返回上一層
   ========================================= */

function goBack() {


    /* 如果有歷史紀錄 */

    if (
        historyPath.length > 0
    ) {


        const previousPath =
            historyPath.pop();


        loadFiles(
            previousPath
        );


        return;

    }


    /* 已經在根目錄 */

    if (
        currentPath !== ""
    ) {


        currentPath = "";


        loadFiles("");

    }

}


/* =========================================
   第一次載入
   ========================================= */

loadFiles();


</script>


</body>

</html>
```

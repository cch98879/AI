<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050816">
<title>互動粒子場｜Particle Field</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050816;color:#fff;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}.panel{position:fixed;z-index:5;top:18px;left:18px;width:315px;padding:18px;border:1px solid #ffffff1c;border-radius:20px;background:rgba(8,16,36,.78);backdrop-filter:blur(16px);box-shadow:0 20px 60px #0009}.title{font-size:21px;font-weight:850;letter-spacing:.3px}.sub{font-size:12px;color:#9ca9c6;margin:5px 0 17px}.row{display:flex;align-items:center;gap:10px;margin:13px 0;font-size:13px}.row>span:first-child{width:68px;flex:none}.row input[type=range]{flex:1;accent-color:#65d9ff}.val{width:44px;text-align:right;color:#73e5ff;font-variant-numeric:tabular-nums}.colors{display:flex;gap:8px;margin-left:auto}.swatch{width:30px;height:30px;border-radius:9px;border:1px solid #fff4;cursor:pointer;transition:.18s;box-shadow:0 0 0 0 transparent}.swatch:hover,.swatch.active{transform:translateY(-2px);box-shadow:0 0 0 2px #fff5}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:17px}.buttons button{border:1px solid #ffffff0e;border-radius:11px;padding:10px 8px;background:#16233f;color:#eaf5ff;font-weight:750;cursor:pointer;transition:.18s}.buttons button:hover{background:#21345a;transform:translateY(-1px)}.buttons button.primary{background:#167da1}.buttons button.primary:hover{background:#1a94bd}.hint{font-size:11px;color:#7f8ca8;margin-top:12px;line-height:1.55}.status{position:fixed;z-index:4;right:18px;bottom:16px;padding:7px 11px;border:1px solid #ffffff12;border-radius:999px;background:#08102499;color:#8fa0c0;font-size:11px;backdrop-filter:blur(10px)}@media(max-width:600px){.panel{width:calc(100% - 28px);left:14px;top:14px;padding:14px}.row input[type=range]{width:38vw}.status{display:none}}
</style>
</head>
<body>
<canvas id="field" aria-label="互動粒子場"></canvas>
<div class="panel">
  <div class="title">✦ 互動粒子場</div>
  <div class="sub">移動游標，讓粒子形成即時旋渦與流動光跡</div>
  <div class="row"><span>粒子數量</span><input id="count" type="range" min="200" max="2500" step="50" value="900"><span id="countV" class="val">900</span></div>
  <div class="row"><span>旋渦力道</span><input id="force" type="range" min="0.1" max="3" step="0.1" value="1.1"><span id="forceV" class="val">1.1</span></div>
  <div class="row"><span>軌跡長度</span><input id="trail" type="range" min="0.70" max="0.99" step="0.01" value="0.90"><span id="trailV" class="val">0.90</span></div>
  <div class="row"><span>背景</span><div class="colors"><button class="swatch active" data-bg="#050816" style="background:#050816" title="深藍" aria-label="深藍背景"></button><button class="swatch" data-bg="#000000" style="background:#000" title="黑色" aria-label="黑色背景"></button><button class="swatch" data-bg="#101010" style="background:#101010" title="深灰" aria-label="深灰背景"></button><button class="swatch" data-bg="#071b1b" style="background:#071b1b" title="墨綠" aria-label="墨綠背景"></button></div></div>
  <div class="buttons"><button id="clear">清除粒子</button><button id="reset">重置</button><button id="shot" class="primary" style="grid-column:1/-1">⬇ 下載截圖</button></div>
  <div class="hint">滑鼠靠近粒子會產生旋轉吸引力；按住滑鼠可增強擾動。觸控裝置可直接拖曳。</div>
</div>
<div class="status" id="status">● 粒子場運行中</div>
<script>
const canvas=document.getElementById('field'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=1,particles=[],mx=-9999,my=-9999,down=false,bg='#050816';
const cfg={count:900,force:1.1,trail:.90};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
function makeParticle(){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*Math.max(W,H)*.62;return{x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,px:0,py:0,vx:(Math.random()-.5)*.7,vy:(Math.random()-.5)*.7,size:Math.random()*1.8+.5,h:Math.random()*360,life:Math.random()}}
function rebuild(){particles=Array.from({length:cfg.count},makeParticle);for(const p of particles){p.px=p.x;p.py=p.y}}
function pointer(e){const r=canvas.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top}
canvas.addEventListener('pointermove',pointer);canvas.addEventListener('pointerdown',e=>{down=true;pointer(e)});addEventListener('pointerup',()=>down=false);canvas.addEventListener('pointerleave',()=>{if(!down){mx=-9999;my=-9999}});
function draw(){
  ctx.fillStyle=bg+Math.round(cfg.trail*255).toString(16).padStart(2,'0');ctx.fillRect(0,0,W,H);
  for(const p of particles){
    p.px=p.x;p.py=p.y;const dx=mx-p.x,dy=my-p.y,dist=Math.hypot(dx,dy),rad=290;
    if(dist<rad){const q=(1-dist/rad)*cfg.force*(down?2.4:1),nx=dx/(dist||1),ny=dy/(dist||1);p.vx+=(-ny*q*.24+nx*q*.055);p.vy+=(nx*q*.24+ny*q*.055)}
    p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.h=(p.h+.45)%360;
    if(p.x<-50||p.x>W+50||p.y<-50||p.y>H+50){Object.assign(p,makeParticle());p.x=Math.random()<.5?Math.random()*W:(Math.random()<.5?-20:W+20);p.y=Math.random()*H;p.px=p.x;p.py=p.y}
    ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.strokeStyle=`hsla(${p.h},95%,68%,${Math.min(.8,.22+p.size*.13)})`;ctx.lineWidth=Math.max(.5,p.size*.65);ctx.stroke();
    ctx.beginPath();ctx.fillStyle=`hsla(${p.h},95%,72%,${.68+p.size*.1})`;ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  if(mx>-1000){ctx.beginPath();ctx.arc(mx,my,down?16:8,0,Math.PI*2);ctx.strokeStyle=`hsla(${(performance.now()/12)%360},95%,70%,${down?.42:.22})`;ctx.lineWidth=1;ctx.stroke()}
}
function loop(){draw();requestAnimationFrame(loop)}
function sync(id,key,out,parse){const el=document.getElementById(id),o=document.getElementById(out);el.addEventListener('input',()=>{cfg[key]=parse(el.value);o.textContent=el.value;if(key==='count')rebuild()})}
sync('count','count','countV',Number);sync('force','force','forceV',Number);sync('trail','trail','trailV',Number);
document.getElementById('clear').onclick=()=>{particles=[]};
document.getElementById('reset').onclick=()=>{cfg.count=900;cfg.force=1.1;cfg.trail=.90;for(const [id,v] of [['count',900],['force',1.1],['trail',.90]]){document.getElementById(id).value=v;document.getElementById(id+'V').textContent=v}bg='#050816';document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('active',b.dataset.bg===bg));rebuild()};
document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{bg=b.dataset.bg;document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active',s===b))});
document.getElementById('shot').onclick=()=>{const out=document.createElement('canvas');out.width=W*dpr;out.height=H*dpr;const ox=out.getContext('2d');ox.fillStyle=bg;ox.fillRect(0,0,out.width,out.height);ox.drawImage(canvas,0,0);const a=document.createElement('a');a.download='particle-field.png';a.href=out.toDataURL('image/png');a.click()};
addEventListener('resize',resize);resize();rebuild();loop();
</script>
</body>
</html>

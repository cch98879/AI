<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Quest｜2D 平台冒險</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#08101f;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;color:#fff}body{display:grid;place-items:center}canvas{width:min(100vw,1280px);height:min(100vh,720px);background:#182653;box-shadow:0 0 60px #0009;border-radius:12px}.hud{position:fixed;top:18px;left:50%;transform:translateX(-50%);width:min(1180px,calc(100% - 32px));display:flex;justify-content:space-between;pointer-events:none;font-weight:800;text-shadow:0 2px 4px #000}.pill,.help{padding:9px 14px;border:1px solid #ffffff2a;border-radius:999px;background:#10182dcc;backdrop-filter:blur(8px)}.help{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font-size:13px;color:#dbe3ff}.modal{position:fixed;inset:0;display:none;place-items:center;background:#030617aa;backdrop-filter:blur(5px)}.card{width:min(430px,calc(100% - 30px));padding:28px;border-radius:22px;background:#121b36;border:1px solid #ffffff25;box-shadow:0 25px 80px #000b;text-align:center}.card h1{margin:0 0 8px}.card p{color:#b9c4e8}.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.buttons button{border:0;border-radius:12px;padding:11px 18px;font-weight:800;cursor:pointer;background:#293963;color:white}.buttons .primary{background:#6c63ff}.stars{color:#ffd85a;font-size:25px}</style></head><body><canvas id="game" width="1280" height="720"></canvas><div class="hud"><div class="pill">🪙 金幣 <b id="coins">0</b>/<b id="total">0</b></div><div class="pill">❤️ 生命 <b id="lives">3</b>　📍 <b id="cp">起點</b></div></div><div class="help">← → / A D 移動　↑ / W / 空白鍵 跳躍（二段跳）　R 重新開始</div><div id="modal" class="modal"><div class="card"><div class="stars">★ ★ ★</div><h1 id="mt">冒險結束</h1><p id="mp">再挑戰一次吧！</p><div class="buttons"><button class="primary" id="restart">重新開始</button><button id="fromcp">從檢查點</button><button id="levels">關卡選擇</button></div></div></div><script>
const C=document.getElementById('game'),X=C.getContext('2d'),W=1280,H=720,K={};let stage=0,L,P,cs,checkpoint,dead=false,won=false,lives=3;addEventListener('keydown',e=>{let k=e.key.toLowerCase();K[k]=1;if([' ','arrowleft','arrowright','arrowup'].includes(k))e.preventDefault();if(k==='r')restart()});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
const levels=[{name:'綠谷起點',spawn:[70,608],goal:[1180,570],p:[[0,650,1280,70],[40,550,180,22],[280,480,170,22],[510,560,150,22],[700,450,180,22],[930,540,150,22],[1100,470,120,22]],c:[[100,510],[330,440],[565,520],[755,410],[985,500],[1150,430]],h:[[210,625,70,25],[455,625,55,25],[660,625,80,25],[860,625,70,25],[1030,625,60,25]],m:{x:460,y:360,w:130,h:18,min:400,max:700,v:1.4},cp:[680,405,'森林檢查點']},{name:'天空遺跡',spawn:[70,608],goal:[1170,250],p:[[0,650,1280,70],[50,560,150,22],[260,510,130,22],[470,430,150,22],[710,350,140,22],[920,280,140,22],[1100,340,140,22]],c:[[110,520],[315,470],[530,390],[770,310],[975,240],[1160,300]],h:[[205,625,60,25],[390,625,80,25],[620,625,90,25],[860,625,80,25],[1010,625,70,25]],m:{x:610,y:500,w:130,h:18,min:500,max:850,v:1.7},cp:[700,305,'雲端檢查點']}];
function load(n=stage,from=false){stage=n;L=levels[n];cs=L.c.map(q=>({x:q[0],y:q[1],got:false}));checkpoint=from?{x:L.cp[0],y:L.cp[1],label:L.cp[2]}:{x:L.spawn[0],y:L.spawn[1],label:'起點'};P={x:checkpoint.x,y:checkpoint.y-42,w:30,h:42,vx:0,vy:0,ground:false,jump:0,inv:0};dead=won=false;modal.style.display='none';total.textContent=cs.length;hud()}
function hud(){coins.textContent=cs.filter(q=>q.got).length;document.getElementById('cp').textContent=checkpoint.label;livesEl=lives;document.getElementById('lives').textContent=lives}function restart(){lives=3;load(stage)}function box(a){return{x:a[0],y:a[1],w:a[2],h:a[3]}}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function platforms(){return L.p.map(box).concat([L.m])}
function die(){if(P.inv>0||dead)return;lives--;if(lives<=0){dead=true;show('冒險結束','生命用完了，再試一次吧！');return}P.inv=1;P.x=checkpoint.x;P.y=checkpoint.y-42;P.vx=P.vy=0}
function show(t,p){mt.textContent=t;mp.textContent=p;fromcp.style.display=checkpoint.label==='起點'?'none':'inline-block';modal.style.display='grid'}
restart.onclick=()=>restart();fromcp.onclick=()=>load(stage,true);levels.onclick=()=>{let n=prompt('輸入關卡：1=綠谷起點、2=天空遺跡','1');if(n==='1'||n==='2'){lives=3;load(+n-1)}};
function physics(){let l=K.a||K.arrowleft,r=K.d||K.arrowright;if(l)P.vx-=.75;if(r)P.vx+=.75;P.vx*=.84;P.vx=Math.max(-7,Math.min(7,P.vx));P.vy=Math.min(P.vy+.55,15);let j=K.w||K.arrowup||K[' '];if(j&&!K._j){if(P.ground||P.jump<2){P.vy=-11;P.ground=false;P.jump++}}K._j=j;P.x+=P.vx;for(let q of platforms())if(hit(P,q)){if(P.vx>0){P.x=q.x-P.w;P.vx=0}else if(P.vx<0){P.x=q.x+q.w;P.vx=0}}P.y+=P.vy;P.ground=false;for(let q of platforms())if(hit(P,q)){if(P.vy>=0){P.y=q.y-P.h;P.vy=0;P.ground=true;P.jump=0}else{P.y=q.y+q.h;P.vy=0}}P.x=Math.max(0,Math.min(W-P.w,P.x));P.inv=Math.max(0,P.inv-.016);L.m.x+=L.m.v;if(L.m.x<L.m.min||L.m.x>L.m.max)L.m.v*=-1;for(let q of L.h.map(box))if(hit(P,q))die();for(let q of cs)if(!q.got&&Math.hypot(P.x+15-q.x,P.y+20-q.y)<30)q.got=true;if(P.x>L.cp[0]-20&&P.x<L.cp[0]+70){checkpoint={x:L.cp[0],y:L.cp[1],label:L.cp[2]}}if(P.y>760)die();if(P.x>L.goal[0]-20&&P.y<L.goal[1]+80){if(stage<levels.length-1)load(stage+1);else{won=true;show('恭喜通關！','你成功抵達終點旗幟！')}}hud()}
function draw(){let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#17245a');g.addColorStop(1,'#55a9bd');X.fillStyle=g;X.fillRect(0,0,W,H);X.fillStyle='#ffffff25';for(let i=0;i<9;i++){let x=i*170;X.beginPath();X.arc(x,120+(i%3)*55,35,0,7);X.arc(x+35,110+(i%3)*55,48,0,7);X.arc(x+80,125+(i%3)*55,30,0,7);X.fill()}for(let q of L.p){q=box(q);X.fillStyle='#263b43';X.fillRect(q.x,q.y,q.w,q.h);X.fillStyle='#65d17d';X.fillRect(q.x,q.y,q.w,6)}let m=L.m;X.fillStyle='#513e77';X.fillRect(m.x,m.y,m.w,m.h);X.fillStyle='#c084fc';X.fillRect(m.x,m.y,m.w,5);for(let q of L.h){q=box(q);X.fillStyle='#d94b64';X.beginPath();for(let x=q.x;x<q.x+q.w;x+=18){X.moveTo(x,q.y+q.h);X.lineTo(x+9,q.y);X.lineTo(x+18,q.y+q.h)}X.fill()}for(let q of cs)if(!q.got){X.fillStyle='#ffd447';X.beginPath();X.arc(q.x,q.y,10,0,7);X.fill()}X.fillStyle='#eee';X.fillRect(L.cp[0],L.cp[1]-42,5,42);X.fillStyle='#6ee7ff';X.beginPath();X.moveTo(L.cp[0]+5,L.cp[1]-42);X.lineTo(L.cp[0]+38,L.cp[1]-32);X.lineTo(L.cp[0]+5,L.cp[1]-22);X.fill();X.fillStyle='#eee';X.fillRect(L.goal[0],L.goal[1]-70,6,70);X.fillStyle='#ff5b7a';X.beginPath();X.moveTo(L.goal[0]+6,L.goal[1]-70);X.lineTo(L.goal[0]+58,L.goal[1]-55);X.lineTo(L.goal[0]+6,L.goal[1]-40);X.fill();if(P.inv===0||Math.floor(performance.now()/100)%2){X.fillStyle='#ffe0bd';X.fillRect(P.x+7,P.y,17,17);X.fillStyle='#6c63ff';X.fillRect(P.x+3,P.y+17,25,25)}X.fillStyle='#fff';X.font='700 18px system-ui';X.fillText('關卡 '+(stage+1)+'｜'+L.name,24,44)}function loop(){if(!dead&&!won)physics();draw();requestAnimationFrame(loop)}load();loop();</script></body></html>

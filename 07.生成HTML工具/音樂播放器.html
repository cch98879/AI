
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>讓AI解決我的生活大小事_音樂播放器</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:#02030b;
    color:white;
}

/* ===== 主畫面 ===== */
#visualizer{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    background:
        radial-gradient(circle at center,
        rgba(52,32,110,.25) 0%,
        rgba(5,7,25,.75) 40%,
        #02030b 100%);
}

/* ===== 背景光暈 ===== */
.glow{
    position:fixed;
    width:55vw;
    height:55vw;
    max-width:700px;
    max-height:700px;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,
        rgba(100,70,255,.18),
        rgba(0,220,255,.08) 35%,
        transparent 70%);
    filter:blur(30px);
    pointer-events:none;
    animation:pulseGlow 4s ease-in-out infinite;
}

@keyframes pulseGlow{
    0%,100%{
        transform:translate(-50%,-50%) scale(.95);
        opacity:.7;
    }
    50%{
        transform:translate(-50%,-50%) scale(1.12);
        opacity:1;
    }
}

/* ===== 標題 ===== */
.title{
    position:fixed;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    text-align:center;
    pointer-events:none;
}

.title h1{
    font-size:clamp(20px,3vw,36px);
    font-weight:700;
    letter-spacing:5px;
    color:#fff;
    text-shadow:
        0 0 8px rgba(120,220,255,.9),
        0 0 25px rgba(100,80,255,.8),
        0 0 45px rgba(0,220,255,.4);
}

.title p{
    margin-top:5px;
    font-size:11px;
    letter-spacing:4px;
    opacity:.6;
}

/* ===== 控制面板 ===== */
.controls{
    position:fixed;
    z-index:10;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    width:min(94%,900px);
    padding:13px 16px;
    border:1px solid rgba(150,210,255,.2);
    border-radius:22px;

    background:rgba(10,14,35,.58);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:
        0 10px 40px rgba(0,0,0,.45),
        inset 0 0 30px rgba(100,150,255,.04),
        0 0 35px rgba(60,120,255,.08);
}

/* ===== 控制列 ===== */
.control-row{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
}

/* ===== 按鈕 ===== */
button,
.file-label{
    border:1px solid rgba(140,210,255,.22);
    background:rgba(255,255,255,.06);
    color:#fff;
    padding:9px 15px;
    border-radius:12px;
    cursor:pointer;
    font-size:13px;
    transition:.25s ease;
    user-select:none;
}

button:hover,
.file-label:hover{
    background:rgba(90,180,255,.15);
    border-color:rgba(100,220,255,.55);
    box-shadow:
        0 0 15px rgba(0,200,255,.18),
        inset 0 0 10px rgba(100,200,255,.08);
    transform:translateY(-1px);
}

button.active{
    background:linear-gradient(
        135deg,
        rgba(0,210,255,.22),
        rgba(120,70,255,.22)
    );
    border-color:rgba(100,220,255,.65);
    box-shadow:
        0 0 18px rgba(0,200,255,.25);
}

input[type=file]{
    display:none;
}

/* ===== 音量靈敏度 ===== */
.slider-box{
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 8px;
}

.slider-box span{
    font-size:12px;
    opacity:.7;
}

input[type=range]{
    width:110px;
    accent-color:#55dfff;
}

/* ===== 音樂名稱 ===== */
.file-name{
    max-width:220px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:12px;
    opacity:.65;
}

/* ===== 音樂播放進度 ===== */
.progress{
    margin-top:10px;
    width:100%;
    height:3px;
    background:rgba(255,255,255,.08);
    border-radius:10px;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:linear-gradient(
        90deg,
        #00eaff,
        #7b61ff,
        #ff55e8
    );
    box-shadow:
        0 0 10px #00eaff,
        0 0 20px #7b61ff;
}

/* ===== 狀態 ===== */
.status{
    text-align:center;
    margin-top:7px;
    font-size:10px;
    letter-spacing:2px;
    opacity:.45;
}

/* ===== 隱藏 Audio ===== */
audio{
    display:none;
}

/* ===== 小螢幕 ===== */
@media(max-width:600px){

    .title{
        top:18px;
    }

    .title h1{
        letter-spacing:3px;
    }

    .controls{
        bottom:10px;
        border-radius:18px;
        padding:10px;
    }

    button,
    .file-label{
        padding:8px 10px;
        font-size:12px;
    }

    .file-name{
        width:100%;
        text-align:center;
        max-width:none;
    }
}
</style>
</head>

<body>

<canvas id="visualizer"></canvas>

<div class="glow"></div>

<div class="title">
    <h1>讓AI解決我的生活大小事_音樂播放器</h1>
</div>

<div class="controls">

    <div class="control-row">

        <!-- 上傳音樂 -->
        <label class="file-label">
            🎵 選擇音樂
            <input type="file" id="fileInput" accept="audio/*">
        </label>

        <!-- 播放 -->
        <button id="playBtn">▶ 播放</button>

        <!-- 模式 -->
        <button id="barBtn" class="active">▥ 條形</button>
        <button id="circleBtn">◉ 圓形</button>

        <!-- 主題 -->
        <button id="themeBtn">🌈 主題</button>

        <!-- 麥克風 -->
        <button id="micBtn">🎤 麥克風</button>

        <!-- 全螢幕 -->
        <button id="fullBtn">⛶ 全螢幕</button>

        <!-- 靈敏度 -->
        <div class="slider-box">
            <span>靈敏度</span>
            <input
                type="range"
                id="sensitivity"
                min="0.5"
                max="3"
                step="0.1"
                value="1.4">
        </div>

    </div>

    <div class="file-name" id="fileName">
        尚未選擇音樂
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="status" id="status">
        READY · 等待音樂
    </div>

</div>

<audio id="audio"></audio>

<script>

/* =====================================================
   基本設定
===================================================== */

const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

const audio = document.getElementById("audio");
const fileInput = document.getElementById("fileInput");

const playBtn = document.getElementById("playBtn");
const barBtn = document.getElementById("barBtn");
const circleBtn = document.getElementById("circleBtn");
const themeBtn = document.getElementById("themeBtn");
const micBtn = document.getElementById("micBtn");
const fullBtn = document.getElementById("fullBtn");

const sensitivity = document.getElementById("sensitivity");

const fileName = document.getElementById("fileName");
const statusText = document.getElementById("status");
const progressBar = document.getElementById("progressBar");

let audioContext;
let analyser;
let source;
let microphoneStream;

let dataArray;
let bufferLength;

let mode = "bars";
let themeIndex = 0;
let sensitivityValue = 1.4;

let animationTime = 0;

const themes = [
    ["#00eaff","#7b61ff","#ff4fd8"],
    ["#00ff9d","#00d9ff","#0066ff"],
    ["#ff4ecd","#9b5cff","#4d7cff"],
    ["#ffe66d","#ff8c42","#ff3d81"],
    ["#ffffff","#6ee7ff","#a78bfa"]
];


/* =====================================================
   Canvas 尺寸
===================================================== */

function resizeCanvas(){

    const dpr = Math.min(window.devicePixelRatio || 1,2);

    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resizeCanvas);
resizeCanvas();


/* =====================================================
   建立 Audio Analyzer
===================================================== */

function setupAudio(){

    if(audioContext) return;

    audioContext = new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

    analyser = audioContext.createAnalyser();

    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.82;

    bufferLength = analyser.frequencyBinCount;

    dataArray = new Uint8Array(bufferLength);

    source = audioContext.createMediaElementSource(audio);

    source.connect(analyser);
    analyser.connect(audioContext.destination);

    statusText.textContent = "AUDIO · 音樂視覺化啟動";
}


/* =====================================================
   上傳音樂
===================================================== */

fileInput.addEventListener("change",function(){

    const file = this.files[0];

    if(!file) return;

    setupAudio();

    const url = URL.createObjectURL(file);

    audio.src = url;

    fileName.textContent = "🎵 " + file.name;

    audio.load();

    audioContext.resume();

    audio.play();

    playBtn.textContent = "⏸ 暫停";

    statusText.textContent =
        "PLAYING · " + file.name;
});


/* =====================================================
   播放 / 暫停
===================================================== */

playBtn.addEventListener("click",async()=>{

    if(!audio.src){

        statusText.textContent =
            "請先選擇一個音樂檔案";

        return;
    }

    setupAudio();

    await audioContext.resume();

    if(audio.paused){

        audio.play();

        playBtn.textContent = "⏸ 暫停";

        statusText.textContent =
            "PLAYING · 音樂播放中";

    }else{

        audio.pause();

        playBtn.textContent = "▶ 播放";

        statusText.textContent =
            "PAUSED · 音樂暫停";
    }
});


/* =====================================================
   條形模式
===================================================== */

barBtn.addEventListener("click",()=>{

    mode = "bars";

    barBtn.classList.add("active");
    circleBtn.classList.remove("active");

    statusText.textContent =
        "VISUALIZER · 條形宇宙";
});


/* =====================================================
   圓形模式
===================================================== */

circleBtn.addEventListener("click",()=>{

    mode = "circle";

    circleBtn.classList.add("active");
    barBtn.classList.remove("active");

    statusText.textContent =
        "VISUALIZER · 圓形星環";
});


/* =====================================================
   色彩主題
===================================================== */

themeBtn.addEventListener("click",()=>{

    themeIndex++;

    if(themeIndex >= themes.length)
        themeIndex = 0;

    statusText.textContent =
        "COLOR · DREAM THEME " +
        (themeIndex + 1);
});


/* =====================================================
   靈敏度
===================================================== */

sensitivity.addEventListener("input",()=>{

    sensitivityValue =
        parseFloat(sensitivity.value);
});


/* =====================================================
   麥克風模式
===================================================== */

micBtn.addEventListener("click",async()=>{

    try{

        if(!audioContext){

            audioContext = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

            analyser =
                audioContext.createAnalyser();

            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = .85;

            bufferLength =
                analyser.frequencyBinCount;

            dataArray =
                new Uint8Array(bufferLength);
        }

        microphoneStream =
            await navigator.mediaDevices.getUserMedia({
                audio:true
            });

        const micSource =
            audioContext.createMediaStreamSource(
                microphoneStream
            );

        micSource.connect(analyser);

        audio.pause();

        playBtn.textContent = "▶ 播放";

        statusText.textContent =
            "MIC · 麥克風即時視覺化";

        micBtn.classList.add("active");

    }catch(error){

        statusText.textContent =
            "MIC ERROR · 無法取得麥克風權限";
    }
});


/* =====================================================
   全螢幕
===================================================== */

fullBtn.addEventListener("click",()=>{

    if(!document.fullscreenElement){

        document.documentElement.requestFullscreen();

    }else{

        document.exitFullscreen();
    }
});


/* =====================================================
   鍵盤快捷鍵
===================================================== */

document.addEventListener("keydown",e=>{

    if(e.code === "Space"){

        e.preventDefault();

        playBtn.click();
    }

    if(e.key.toLowerCase() === "f"){

        fullBtn.click();
    }

    if(e.key.toLowerCase() === "m"){

        micBtn.click();
    }
});


/* =====================================================
   星空粒子
===================================================== */

const stars = [];

for(let i=0;i<180;i++){

    stars.push({

        x:Math.random(),
        y:Math.random(),

        size:
            Math.random()*1.8+.2,

        speed:
            Math.random()*.00035+.00005,

        alpha:
            Math.random()*.7+.2,

        phase:
            Math.random()*Math.PI*2
    });
}


/* =====================================================
   星空背景
===================================================== */

function drawStars(){

    const w = window.innerWidth;
    const h = window.innerHeight;

    stars.forEach(star=>{

        star.y -= star.speed;

        if(star.y < 0)
            star.y = 1;

        const twinkle =
            .5 +
            .5 *
            Math.sin(
                animationTime*.002 +
                star.phase
            );

        ctx.beginPath();

        ctx.arc(
            star.x*w,
            star.y*h,
            star.size,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            `rgba(180,220,255,${star.alpha*twinkle})`;

        ctx.fill();
    });
}


/* =====================================================
   中央夢幻光球
===================================================== */

function drawCore(avg){

    const w = window.innerWidth;
    const h = window.innerHeight;

    const cx = w/2;
    const cy = h/2;

    const power =
        avg / 255 *
        sensitivityValue;

    const radius =
        Math.min(w,h)*.08 +
        power*80;

    const gradient =
        ctx.createRadialGradient(
            cx,cy,0,
            cx,cy,radius*3
        );

    const colors = themes[themeIndex];

    gradient.addColorStop(
        0,
        colors[0] + "66"
    );

    gradient.addColorStop(
        .35,
        colors[1] + "22"
    );

    gradient.addColorStop(
        1,
        "transparent"
    );

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius*3,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* 中央核心 */
    const core =
        ctx.createRadialGradient(
            cx,cy,0,
            cx,cy,radius
        );

    core.addColorStop(
        0,
        "rgba(255,255,255,.9)"
    );

    core.addColorStop(
        .2,
        colors[0] + "cc"
    );

    core.addColorStop(
        .65,
        colors[1] + "55"
    );

    core.addColorStop(
        1,
        "transparent"
    );

    ctx.fillStyle = core;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =====================================================
   條形視覺化
===================================================== */

function drawBars(){

    const w = window.innerWidth;
    const h = window.innerHeight;

    const centerY = h/2;

    const colors = themes[themeIndex];

    const usable =
        Math.min(bufferLength,120);

    const barWidth =
        w / usable * .72;

    for(let i=0;i<usable;i++){

        const value =
            dataArray[i] *
            sensitivityValue;

        const percent =
            Math.min(value/255,1);

        const height =
            percent *
            h*.38;

        const x =
            i *
            (w/usable);

        const hueProgress =
            i/usable;

        let color;

        if(hueProgress < .5){

            color = colors[0];

        }else{

            color = colors[1];
        }

        ctx.shadowBlur = 18;
        ctx.shadowColor = color;

        const gradient =
            ctx.createLinearGradient(
                0,
                centerY-height,
                0,
                centerY+height
            );

        gradient.addColorStop(
            0,
            colors[2]
        );

        gradient.addColorStop(
            .5,
            color
        );

        gradient.addColorStop(
            1,
            colors[0]
        );

        ctx.fillStyle = gradient;

        /* 上方 */
        ctx.fillRect(
            x,
            centerY-height,
            barWidth,
            height
        );

        /* 下方 */
        ctx.fillRect(
            x,
            centerY,
            barWidth,
            height
        );

        /* 小光點 */
        if(percent > .15){

            ctx.fillStyle =
                "rgba(255,255,255,.8)";

            ctx.fillRect(
                x,
                centerY-height-2,
                barWidth,
                2
            );
        }
    }

    ctx.shadowBlur = 0;
}


/* =====================================================
   圓形星環模式
===================================================== */

function drawCircle(){

    const w = window.innerWidth;
    const h = window.innerHeight;

    const cx = w/2;
    const cy = h/2;

    const baseRadius =
        Math.min(w,h)*.19;

    const colors = themes[themeIndex];

    const count =
        Math.min(bufferLength,180);

    ctx.save();

    ctx.translate(cx,cy);

    /* 外圍旋轉星環 */

    ctx.rotate(
        animationTime*.00015
    );

    for(let i=0;i<count;i++){

        const value =
            dataArray[i] *
            sensitivityValue;

        const percent =
            Math.min(value/255,1);

        const angle =
            i/count *
            Math.PI*2;

        const length =
            20 +
            percent*180;

        const inner =
            baseRadius;

        const outer =
            baseRadius + length;

        const x1 =
            Math.cos(angle)*inner;

        const y1 =
            Math.sin(angle)*inner;

        const x2 =
            Math.cos(angle)*outer;

        const y2 =
            Math.sin(angle)*outer;

        let color;

        if(i/count < .33)
            color = colors[0];

        else if(i/count < .66)
            color = colors[1];

        else
            color = colors[2];

        ctx.beginPath();

        ctx.moveTo(x1,y1);

        ctx.lineTo(x2,y2);

        ctx.lineWidth =
            1 +
            percent*3;

        ctx.strokeStyle =
            color;

        ctx.globalAlpha =
            .25 +
            percent*.75;

        ctx.shadowBlur =
            12 +
            percent*20;

        ctx.shadowColor =
            color;

        ctx.stroke();
    }

    ctx.restore();

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;


    /* 內圈 */
    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        baseRadius,
        0,
        Math.PI*2
    );

    ctx.lineWidth = 1;

    ctx.strokeStyle =
        colors[0] + "88";

    ctx.shadowBlur = 25;

    ctx.shadowColor =
        colors[0];

    ctx.stroke();

    ctx.shadowBlur = 0;
}


/* =====================================================
   音樂進度
===================================================== */

function updateProgress(){

    if(audio.duration){

        const percent =
            audio.currentTime /
            audio.duration *
            100;

        progressBar.style.width =
            percent + "%";
    }
}

audio.addEventListener(
    "timeupdate",
    updateProgress
);


/* =====================================================
   主動畫
===================================================== */

function animate(){

    requestAnimationFrame(animate);

    animationTime =
        performance.now();

    const w = window.innerWidth;
    const h = window.innerHeight;


    /* 背景 */

    ctx.clearRect(
        0,
        0,
        w,
        h
    );

    const bg =
        ctx.createRadialGradient(
            w/2,
            h/2,
            0,
            w/2,
            h/2,
            Math.max(w,h)*.7
        );

    bg.addColorStop(
        0,
        "rgba(25,20,70,.35)"
    );

    bg.addColorStop(
        .5,
        "rgba(4,7,25,.7)"
    );

    bg.addColorStop(
        1,
        "#02030b"
    );

    ctx.fillStyle = bg;

    ctx.fillRect(
        0,
        0,
        w,
        h
    );


    /* 星空 */

    drawStars();


    let average = 0;


    if(analyser){

        analyser.getByteFrequencyData(
            dataArray
        );

        let total = 0;

        for(let i=0;i<bufferLength;i++){

            total += dataArray[i];
        }

        average =
            total / bufferLength;
    }


    /* 中央核心 */

    drawCore(average);


    /* 視覺化 */

    if(mode === "bars"){

        drawBars();

    }else{

        drawCircle();
    }


    /* 中央細線光環 */

    const pulse =
        average / 255 *
        sensitivityValue;

    const cx = w/2;
    const cy = h/2;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        Math.min(w,h)*.12 +
        pulse*25,
        0,
        Math.PI*2
    );

    ctx.strokeStyle =
        themes[themeIndex][0] +
        "30";

    ctx.lineWidth = 1;

    ctx.shadowBlur = 15;

    ctx.shadowColor =
        themes[themeIndex][0];

    ctx.stroke();

    ctx.shadowBlur = 0;
}

animate();


/* =====================================================
   音樂結束
===================================================== */

audio.addEventListener("ended",()=>{

    playBtn.textContent = "▶ 播放";

    statusText.textContent =
        "READY · 音樂播放完畢";
});

</script>

</body>
</html>

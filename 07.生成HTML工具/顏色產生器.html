<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>讓AI解決我的生活大小事_顏色產生器</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg1: #060817;
    --bg2: #101535;
    --glass: rgba(255,255,255,.08);
    --border: rgba(255,255,255,.16);
    --text: #ffffff;
    --sub: rgba(255,255,255,.65);
    --neon: #8be9ff;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 15% 20%, rgba(91,76,255,.30), transparent 30%),
        radial-gradient(circle at 85% 25%, rgba(0,229,255,.20), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(255,0,204,.18), transparent 35%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
    overflow-x: hidden;
}

/* 動態背景光球 */

body::before,
body::after {
    content: "";
    position: fixed;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .22;
    pointer-events: none;
    z-index: -1;
}

body::before {
    background: #00eaff;
    left: -150px;
    top: 20%;
    animation: float1 10s ease-in-out infinite;
}

body::after {
    background: #b400ff;
    right: -150px;
    bottom: 5%;
    animation: float2 12s ease-in-out infinite;
}

@keyframes float1 {
    0%,100% {
        transform: translate(0,0);
    }
    50% {
        transform: translate(80px,-50px);
    }
}

@keyframes float2 {
    0%,100% {
        transform: translate(0,0);
    }
    50% {
        transform: translate(-70px,40px);
    }
}

/* 主容器 */

.container {
    width: min(1400px,94%);
    margin: auto;
    padding: 55px 0;
}

/* 標題 */

.header {
    text-align: center;
    margin-bottom: 45px;
}

.logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    border: 1px solid rgba(139,233,255,.35);
    border-radius: 999px;
    background: rgba(139,233,255,.07);
    color: #9cecff;
    font-size: 14px;
    letter-spacing: 3px;
    box-shadow:
        0 0 20px rgba(0,220,255,.12),
        inset 0 0 15px rgba(255,255,255,.03);
}

.logo::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #7df9ff;
    box-shadow: 0 0 12px #7df9ff;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0%,100% {
        opacity: .5;
        transform: scale(.8);
    }
    50% {
        opacity: 1;
        transform: scale(1.2);
    }
}

h1 {
    margin: 22px 0 10px;
    font-size: clamp(32px,5vw,60px);
    letter-spacing: 4px;
    font-weight: 800;
    background:
        linear-gradient(
            90deg,
            #ffffff,
            #a8efff,
            #c9a7ff,
            #ffffff
        );
    background-size: 250%;
    -webkit-background-clip: text;
    color: transparent;
    animation: titleGlow 7s linear infinite;
}

@keyframes titleGlow {
    from {
        background-position: 0%;
    }
    to {
        background-position: 250%;
    }
}

.subtitle {
    color: var(--sub);
    font-size: 16px;
    letter-spacing: 2px;
}

/* 調色盤 */

.palette {
    display: grid;
    grid-template-columns: repeat(5,1fr);
    gap: 18px;
}

/* 色塊 */

.color-card {
    position: relative;
    min-height: 470px;
    border-radius: 28px;
    overflow: hidden;
    cursor: pointer;

    background: var(--color);

    box-shadow:
        0 20px 50px rgba(0,0,0,.30),
        0 0 35px var(--color);

    transition:
        transform .35s cubic-bezier(.2,.8,.2,1),
        box-shadow .35s;
}

.color-card:hover {
    transform: translateY(-10px) scale(1.015);

    box-shadow:
        0 25px 65px rgba(0,0,0,.4),
        0 0 55px var(--color);
}

.color-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.25),
            transparent 35%,
            rgba(255,255,255,.04)
        );
    pointer-events: none;
}

/* 玻璃資訊區 */

.info {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 12px;

    padding: 18px;

    border-radius: 20px;

    background: rgba(0,0,0,.32);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,.22);

    box-shadow:
        inset 0 1px rgba(255,255,255,.18),
        0 10px 30px rgba(0,0,0,.15);
}

.number {
    font-size: 13px;
    opacity: .7;
    letter-spacing: 2px;
    margin-bottom: 8px;
}

.hex {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 7px;
    text-shadow: 0 0 15px rgba(255,255,255,.4);
}

.rgb {
    font-size: 13px;
    opacity: .78;
    margin-bottom: 14px;
}

/* 複製按鈕 */

.copy-row {
    display: flex;
    gap: 8px;
}

.copy-btn {
    flex: 1;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.1);
    color: white;
    padding: 9px 6px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 12px;
    transition: .2s;
}

.copy-btn:hover {
    background: rgba(255,255,255,.22);
    transform: translateY(-2px);
}

.copy-btn:active {
    transform: scale(.94);
}

/* 鎖定 */

.lock {
    position: absolute;
    right: 18px;
    top: 18px;

    width: 46px;
    height: 46px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.25);

    backdrop-filter: blur(10px);

    font-size: 21px;

    cursor: pointer;

    transition: .25s;
}

.lock:hover {
    transform: scale(1.1);
    background: rgba(255,255,255,.18);
}

.locked {
    box-shadow:
        0 0 0 2px rgba(255,255,255,.35),
        0 0 25px rgba(255,255,255,.35);
}

/* 控制區 */

.controls {
    margin-top: 32px;

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.main-btn {
    position: relative;

    border: 1px solid rgba(255,255,255,.25);

    color: white;

    padding: 15px 28px;

    border-radius: 999px;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.15),
            rgba(255,255,255,.05)
        );

    backdrop-filter: blur(15px);

    box-shadow:
        0 0 25px rgba(95,220,255,.15),
        inset 0 1px rgba(255,255,255,.15);

    transition: .25s;
}

.main-btn:hover {
    transform: translateY(-3px);

    box-shadow:
        0 0 35px rgba(95,220,255,.35),
        inset 0 1px rgba(255,255,255,.25);
}

.main-btn:active {
    transform: scale(.95);
}

/* 快捷鍵 */

.shortcut {
    margin-top: 30px;
    text-align: center;

    color: rgba(255,255,255,.55);

    font-size: 13px;
}

kbd {
    display: inline-block;

    padding: 3px 8px;

    margin: 0 3px;

    border-radius: 6px;

    background: rgba(255,255,255,.1);

    border: 1px solid rgba(255,255,255,.15);

    color: white;

    box-shadow: inset 0 -2px rgba(0,0,0,.2);
}

/* Toast */

.toast {
    position: fixed;

    left: 50%;
    bottom: 35px;

    transform:
        translate(-50%,30px)
        scale(.9);

    opacity: 0;

    padding: 12px 22px;

    border-radius: 999px;

    background: rgba(10,15,35,.8);

    border: 1px solid rgba(139,233,255,.3);

    backdrop-filter: blur(18px);

    color: white;

    box-shadow:
        0 0 30px rgba(0,220,255,.2);

    pointer-events: none;

    transition: .3s;

    z-index: 100;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%,0)
        scale(1);
}

/* RWD */

@media(max-width:1000px) {
    .palette {
        grid-template-columns: repeat(2,1fr);
    }
}

@media(max-width:600px) {

    .container {
        padding: 35px 0;
    }

    .palette {
        grid-template-columns: 1fr;
    }

    .color-card {
        min-height: 330px;
    }

    h1 {
        font-size: 35px;
    }

    .subtitle {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">

        <div class="logo">
            讓AI解決我的生活大小事_顏色產生器
        </div>


    </header>


    <main id="palette" class="palette"></main>


    <div class="controls">

        <button
            class="main-btn"
            onclick="generatePalette()">
            ✦ 隨機產生色彩
        </button>

        <button
            class="main-btn"
            onclick="unlockAll()">
            ◇ 全部解鎖
        </button>

    </div>




</div>


<div id="toast" class="toast">
    ✓ 已複製
</div>


<script>

/* =========================
   基本資料
========================= */

const colors = [];

let selectedIndex = 0;


/* =========================
   隨機顏色
========================= */

function randomColor() {

    const letters = "0123456789ABCDEF";

    let color = "#";

    for(let i=0;i<6;i++) {

        color +=
            letters[
                Math.floor(
                    Math.random()*16
                )
            ];

    }

    return color;
}


/* =========================
   HEX → RGB
========================= */

function hexToRgb(hex) {

    const value =
        hex.replace("#","");

    const r =
        parseInt(
            value.substring(0,2),
            16
        );

    const g =
        parseInt(
            value.substring(2,4),
            16
        );

    const b =
        parseInt(
            value.substring(4,6),
            16
        );

    return `rgb(${r}, ${g}, ${b})`;
}


/* =========================
   建立調色盤
========================= */

function createPalette() {

    const palette =
        document.getElementById("palette");

    palette.innerHTML = "";

    colors.forEach((item,index)=>{

        const card =
            document.createElement("div");

        card.className =
            "color-card";

        card.style.setProperty(
            "--color",
            item.color
        );

        card.innerHTML = `

            <div
                class="lock ${item.locked ? "locked" : ""}"
                onclick="toggleLock(event,${index})">

                ${item.locked ? "🔒" : "🔓"}

            </div>


            <div class="info">

                <div class="number">
                    COLOR ${String(index+1).padStart(2,"0")}
                </div>

                <div class="hex">
                    ${item.color}
                </div>

                <div class="rgb">
                    ${hexToRgb(item.color)}
                </div>

                <div class="copy-row">

                    <button
                        class="copy-btn"
                        onclick="copyColor(event,${index},'hex')">

                        HEX 複製

                    </button>

                    <button
                        class="copy-btn"
                        onclick="copyColor(event,${index},'rgb')">

                        RGB 複製

                    </button>

                </div>

            </div>
        `;


        card.addEventListener(
            "click",
            function(){

                selectedIndex = index;

            }
        );


        palette.appendChild(card);

    });

}


/* =========================
   初始化
========================= */

function init() {

    for(let i=0;i<5;i++) {

        colors.push({
            color: randomColor(),
            locked: false
        });

    }

    createPalette();

}


/* =========================
   隨機產生
========================= */

function generatePalette() {

    colors.forEach(item=>{

        if(!item.locked) {

            item.color =
                randomColor();

        }

    });

    createPalette();

    showToast("✨ 色彩已重新生成");

}


/* =========================
   鎖定
========================= */

function toggleLock(event,index) {

    event.stopPropagation();

    colors[index].locked =
        !colors[index].locked;

    selectedIndex = index;

    createPalette();

}


/* =========================
   全部解鎖
========================= */

function unlockAll() {

    colors.forEach(item=>{

        item.locked = false;

    });

    createPalette();

    showToast("🔓 已全部解鎖");

}


/* =========================
   複製
========================= */

async function copyColor(
    event,
    index,
    type
) {

    event.stopPropagation();

    const color =
        colors[index].color;

    let text = color;

    if(type === "rgb") {

        text =
            hexToRgb(color);

    }

    try {

        await navigator.clipboard.writeText(
            text
        );

        selectedIndex = index;

        showToast(
            `✓ ${text} 已複製`
        );

    } catch {

        showToast(
            "複製失敗，請手動複製"
        );

    }

}


/* =========================
   Toast
========================= */

let toastTimer;

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(()=>{

            toast.classList.remove("show");

        },1500);

}





/* 啟動 */

init();

</script>

</body>
</html>

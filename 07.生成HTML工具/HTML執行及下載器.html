<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>讓AI解決我的生活大小事_HTML執行及下載器</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    min-height:100vh;
    font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    color:#fff;
    overflow-x:hidden;

    /* 夢幻背景 */
    background:
        radial-gradient(circle at 20% 20%, rgba(168,85,247,.35), transparent 28%),
        radial-gradient(circle at 80% 10%, rgba(59,130,246,.35), transparent 28%),
        radial-gradient(circle at 70% 80%, rgba(236,72,153,.25), transparent 30%),
        linear-gradient(135deg,#09001f,#10104a,#061b3d);
}

/* =========================
   夢幻星星
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background-image:
        radial-gradient(circle,rgba(255,255,255,.9) 1px,transparent 1px),
        radial-gradient(circle,rgba(255,255,255,.6) 1px,transparent 1px),
        radial-gradient(circle,rgba(255,255,255,.4) 1px,transparent 1px);

    background-size:
        90px 90px,
        140px 140px,
        200px 200px;

    background-position:
        10px 20px,
        50px 80px,
        120px 40px;

    opacity:.55;
    animation:stars 20s linear infinite;
}

@keyframes stars{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-80px);
    }
}

/* =========================
   夢幻光暈
========================= */

body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    left:50%;
    top:40%;
    transform:translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(139,92,246,.18),
            transparent 70%
        );

    filter:blur(30px);
    pointer-events:none;
}

/* =========================
   主容器
========================= */

.wrap{
    position:relative;
    z-index:2;

    width:min(1450px,94vw);
    margin:28px auto 40px;
}

/* =========================
   標題區
========================= */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:20px;
}

.title{
    animation:titleGlow 3s ease-in-out infinite alternate;
}

@keyframes titleGlow{
    from{
        filter:drop-shadow(0 0 5px rgba(255,255,255,.15));
    }
    to{
        filter:drop-shadow(0 0 18px rgba(168,85,247,.45));
    }
}

.title h1{
    margin:0;
    font-size:clamp(23px,3vw,38px);
    font-weight:900;

    background:
        linear-gradient(
            90deg,
            #fff,
            #c4b5fd,
            #93c5fd,
            #f9a8d4,
            #fff
        );

    background-size:300% auto;

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    animation:titleGradient 6s linear infinite;
}

@keyframes titleGradient{
    from{
        background-position:0% center;
    }
    to{
        background-position:300% center;
    }
}

.title p{
    margin:8px 0 0;
    color:#dbeafe;
    font-size:15px;
    letter-spacing:.5px;
}

/* =========================
   按鈕
========================= */

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

button{
    position:relative;
    border:1px solid rgba(255,255,255,.25);
    border-radius:14px;

    padding:12px 20px;

    font-size:15px;
    font-weight:800;
    cursor:pointer;

    color:#fff;

    background:rgba(255,255,255,.10);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.15);

    transition:
        transform .2s,
        box-shadow .2s,
        background .2s;
}

button:hover{
    transform:translateY(-3px) scale(1.03);

    background:rgba(255,255,255,.18);

    box-shadow:
        0 10px 30px rgba(0,0,0,.3),
        0 0 20px rgba(167,139,250,.35);
}

button:active{
    transform:translateY(0) scale(.98);
}

.run{
    background:
        linear-gradient(
            135deg,
            rgba(34,197,94,.8),
            rgba(16,185,129,.55)
        );

    box-shadow:
        0 0 20px rgba(34,197,94,.25);
}

.download{
    background:
        linear-gradient(
            135deg,
            rgba(59,130,246,.85),
            rgba(99,102,241,.6)
        );

    box-shadow:
        0 0 20px rgba(59,130,246,.25);
}

.clear{
    background:
        linear-gradient(
            135deg,
            rgba(100,116,139,.75),
            rgba(71,85,105,.55)
        );
}

/* =========================
   左右區域
========================= */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

/* =========================
   玻璃面板
========================= */

.panel{
    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.045)
        );

    border:1px solid rgba(255,255,255,.20);

    border-radius:22px;

    overflow:hidden;

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.15);

    transition:
        transform .3s,
        box-shadow .3s;
}

.panel:hover{
    transform:translateY(-3px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.4),
        0 0 35px rgba(139,92,246,.15),
        inset 0 1px 0 rgba(255,255,255,.2);
}

/* =========================
   標題列
========================= */

.bar{
    height:52px;
    padding:0 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:
        linear-gradient(
            90deg,
            rgba(139,92,246,.28),
            rgba(59,130,246,.18),
            rgba(236,72,153,.15)
        );

    border-bottom:1px solid rgba(255,255,255,.15);

    font-weight:900;
    letter-spacing:.5px;
}

.bar span:first-child{
    text-shadow:
        0 0 10px rgba(255,255,255,.35);
}

.hint{
    font-size:12px;
    color:#dbeafe;
    font-weight:500;
    opacity:.85;
}

/* =========================
   程式碼輸入區
========================= */

textarea{
    display:block;
    width:100%;
    height:600px;

    resize:vertical;

    border:0;
    outline:0;

    background:
        linear-gradient(
            180deg,
            rgba(2,6,23,.88),
            rgba(15,23,42,.82)
        );

    color:#e0e7ff;

    padding:20px;

    font:
        14px/1.65
        ui-monospace,
        SFMono-Regular,
        Consolas,
        "Liberation Mono",
        monospace;

    tab-size:2;

    caret-color:#c4b5fd;

    text-shadow:
        0 0 5px rgba(147,197,253,.12);
}

textarea::selection{
    background:rgba(139,92,246,.45);
}

textarea::placeholder{
    color:#94a3b8;
}

/* =========================
   預覽區
========================= */

iframe{
    display:block;

    width:100%;
    height:600px;

    border:0;

    background:#fff;
}

/* =========================
   狀態列
========================= */

.status{
    margin-top:14px;

    padding:12px 16px;

    color:#dbeafe;

    font-size:13px;

    border-radius:14px;

    background:rgba(255,255,255,.07);

    border:1px solid rgba(255,255,255,.10);

    backdrop-filter:blur(10px);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08);
}

/* =========================
   快捷鍵
========================= */

.kbd{
    padding:2px 7px;

    border:1px solid rgba(255,255,255,.25);

    border-radius:6px;

    color:#e0e7ff;

    background:rgba(255,255,255,.08);
}

/* =========================
   小螢光球
========================= */

.magic-orb{
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    z-index:1;

    filter:blur(1px);

    animation:floatOrb 8s ease-in-out infinite;
}

.orb1{
    width:90px;
    height:90px;
    left:5%;
    top:25%;

    background:
        radial-gradient(
            circle,
            rgba(168,85,247,.35),
            transparent 70%
        );
}

.orb2{
    width:120px;
    height:120px;
    right:5%;
    bottom:12%;

    background:
        radial-gradient(
            circle,
            rgba(59,130,246,.30),
            transparent 70%
        );

    animation-delay:2s;
}

@keyframes floatOrb{
    0%,100%{
        transform:translate(0,0);
    }

    50%{
        transform:translate(20px,-30px);
    }
}

/* =========================
   RWD
========================= */

@media(max-width:850px){

    .grid{
        grid-template-columns:1fr;
    }

    .header{
        align-items:flex-start;
        flex-direction:column;
    }

    .actions{
        width:100%;
    }

    button{
        flex:1;
    }

    textarea,
    iframe{
        height:480px;
    }
}

@media(max-width:550px){

    .wrap{
        width:94vw;
        margin-top:18px;
    }

    .title h1{
        font-size:25px;
    }

    .title p{
        font-size:13px;
    }

    .actions{
        display:grid;
        grid-template-columns:1fr 1fr 1fr;
    }

    button{
        padding:10px 8px;
        font-size:13px;
    }

    .panel{
        border-radius:18px;
    }
}
</style>
</head>

<body>

<!-- 夢幻漂浮光球 -->
<div class="magic-orb orb1"></div>
<div class="magic-orb orb2"></div>

<div class="wrap">

    <!-- =========================
         標題
    ========================== -->

    <div class="header">

        <div class="title">

            <h1>
                💻讓AI解決我的生活大小事_HTML執行及下載器
            </h1>

            <p>
                🌌 貼上 HTML 程式碼 → ✨ 執行預覽 → 🚀 下載 HTML 檔案
            </p>

        </div>

        <!-- =========================
             按鈕
        ========================== -->

        <div class="actions">

            <button class="run" id="run">
                ▶ 執行
            </button>

            <button class="download" id="download">
                ⬇ 下載
            </button>

            <button class="clear" id="clear">
                🗑 清除
            </button>

        </div>

    </div>


    <!-- =========================
         左右面板
    ========================== -->

    <div class="grid">

        <!-- 左：HTML -->
        <section class="panel">

            <div class="bar">

                <span>
                    💻 HTML程式碼
                </span>

                <span class="hint">
                    Ctrl + Enter 可執行
                </span>

            </div>

            <textarea
                id="code"
                spellcheck="false"
                placeholder="✨ 請在這裡貼上 HTML 程式碼…"
            >請於此區貼上HTML程式碼</textarea>

        </section>


        <!-- 右：預覽 -->
        <section class="panel">

            <div class="bar">

                <span>
                    🌟 執行結果
                </span>

                <span class="hint">
                    獨立預覽區
                </span>

            </div>

            <iframe
                id="preview"
                title="HTML 預覽"
                sandbox="allow-scripts allow-forms allow-modals allow-popups">
            </iframe>

        </section>

    </div>


    <!-- =========================
         狀態
    ========================== -->

    <div class="status" id="status">
        ✨ HTML 已執行並顯示於右側預覽區。
    </div>

</div>


<script>

const code =
    document.getElementById('code');

const preview =
    document.getElementById('preview');

const status =
    document.getElementById('status');


/* =========================
   執行 HTML
========================= */

function runCode(){

    preview.srcdoc = code.value;

    status.textContent =
        '✨ HTML 已執行並顯示於右側預覽區。';

}


/* =========================
   下載 HTML
========================= */

function downloadCode(){

    const blob =
        new Blob(
            [code.value],
            {
                type:'text/html;charset=utf-8'
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement('a');

    a.href = url;

    a.download = 'index.html';

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

    status.textContent =
        '🚀 已下載 HTML 檔案：index.html';

}


/* =========================
   清除
========================= */

function clearCode(){

    code.value = '';

    preview.srcdoc = '';

    status.textContent =
        '🧹 已清除程式碼與預覽結果。';

    code.focus();

}


/* =========================
   按鈕事件
========================= */

document
    .getElementById('run')
    .addEventListener(
        'click',
        runCode
    );

document
    .getElementById('download')
    .addEventListener(
        'click',
        downloadCode
    );

document
    .getElementById('clear')
    .addEventListener(
        'click',
        clearCode
    );


/* =========================
   Ctrl + Enter
========================= */

code.addEventListener(
    'keydown',
    e => {

        if(
            (e.ctrlKey || e.metaKey)
            &&
            e.key === 'Enter'
        ){

            e.preventDefault();

            runCode();

        }

    }
);


/* =========================
   啟動
========================= */

runCode();

</script>

</body>
</html>

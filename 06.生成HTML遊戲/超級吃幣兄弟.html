<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>讓AI解決我的生活大小事_超級吃幣兄弟</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020611;
    font-family:"Segoe UI","Microsoft JhengHei",sans-serif;
}

body{
    color:white;
}

/* ===== 遊戲畫面 ===== */
#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 20%,rgba(0,210,255,.18),transparent 35%),
        radial-gradient(circle at 20% 80%,rgba(140,0,255,.15),transparent 30%),
        linear-gradient(180deg,#020617,#07152c 55%,#02050e);
}

/* 星空 */
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:.8;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.15;transform:scale(.6)}
    to{opacity:1;transform:scale(1.5)}
}

/* ===== HUD ===== */
#hud{
    position:absolute;
    z-index:100;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    width:min(900px,94vw);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 20px;
    border:1px solid rgba(0,220,255,.5);
    border-radius:18px;
    background:rgba(2,10,28,.68);
    backdrop-filter:blur(12px);
    box-shadow:
        0 0 20px rgba(0,220,255,.15),
        inset 0 0 20px rgba(0,220,255,.05);
}

.hud-item{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:17px;
    font-weight:bold;
    text-shadow:0 0 10px #00eaff;
}

.coin-icon{
    color:#ffe45c;
    text-shadow:0 0 12px #ffe45c;
}

#levelName{
    color:#76efff;
}

/* ===== 世界 ===== */
#world{
    position:absolute;
    left:0;
    top:0;
    width:5000px;
    height:100%;
    transition:transform .05s linear;
}

/* ===== 玩家 ===== */
#player{
    position:absolute;
    width:34px;
    height:48px;
    z-index:30;
    border-radius:12px 12px 9px 9px;
    background:
        linear-gradient(135deg,#ffffff 0%,#5cf4ff 35%,#1670ff 100%);
    box-shadow:
        0 0 12px #00eaff,
        0 0 28px rgba(0,220,255,.8),
        inset 0 0 10px white;
}

#player::before{
    content:"";
    position:absolute;
    width:15px;
    height:15px;
    left:9px;
    top:8px;
    border-radius:50%;
    background:#031127;
    box-shadow:0 0 8px #fff;
}

#player::after{
    content:"";
    position:absolute;
    width:26px;
    height:5px;
    left:4px;
    bottom:-7px;
    border-radius:50%;
    background:#00eaff;
    filter:blur(3px);
    opacity:.8;
}

/* ===== 平台 ===== */
.platform{
    position:absolute;
    height:18px;
    border-radius:10px;
    background:
        linear-gradient(90deg,#064b78,#00d9ff,#5d37ff,#064b78);
    border:1px solid #76f5ff;
    box-shadow:
        0 0 10px #00d9ff,
        0 0 28px rgba(0,217,255,.45);
}

.platform::after{
    content:"";
    position:absolute;
    left:8%;
    right:8%;
    bottom:-8px;
    height:5px;
    border-radius:50%;
    background:#00eaff;
    filter:blur(5px);
    opacity:.45;
}

/* 移動平台 */
.moving{
    animation:platformGlow 1.2s infinite alternate;
}

@keyframes platformGlow{
    from{filter:brightness(.9)}
    to{filter:brightness(1.5)}
}

/* ===== 金幣 ===== */
.coin{
    position:absolute;
    width:23px;
    height:23px;
    border-radius:50%;
    border:3px solid #fff1a8;
    background:radial-gradient(circle,#fff,#ffe34e 35%,#ff9f00);
    box-shadow:
        0 0 8px #ffe34e,
        0 0 20px #ffb300;
    animation:coinFloat .8s infinite alternate;
}

@keyframes coinFloat{
    from{transform:translateY(0) rotateY(0deg)}
    to{transform:translateY(-8px) rotateY(180deg)}
}

/* ===== 危險 ===== */
.hazard{
    position:absolute;
    height:14px;
    border-radius:8px;
    background:linear-gradient(90deg,#ff003c,#ff5e00,#ff003c);
    box-shadow:
        0 0 10px #ff003c,
        0 0 25px rgba(255,0,60,.8);
    animation:dangerPulse .6s infinite alternate;
}

@keyframes dangerPulse{
    from{filter:brightness(.8)}
    to{filter:brightness(1.6)}
}

/* 雷射 */
.laser{
    position:absolute;
    width:8px;
    background:#ff174f;
    box-shadow:0 0 10px #ff174f,0 0 30px #ff003c;
    animation:laserPulse .35s infinite alternate;
}

@keyframes laserPulse{
    from{opacity:.45}
    to{opacity:1}
}

/* ===== 旗子 ===== */
.flag{
    position:absolute;
    width:8px;
    height:75px;
    background:linear-gradient(#fff,#55eaff);
    box-shadow:0 0 12px #00eaff;
}

.flag::before{
    content:"";
    position:absolute;
    top:0;
    left:6px;
    width:52px;
    height:35px;
    background:
        linear-gradient(135deg,#ff4fd8,#654cff,#00eaff);
    clip-path:polygon(0 0,100% 20%,72% 50%,100% 80%,0 100%);
    box-shadow:0 0 15px #9b4dff;
}

.flag::after{
    content:"";
    position:absolute;
    bottom:-7px;
    left:-10px;
    width:28px;
    height:10px;
    border-radius:50%;
    background:#00eaff;
    filter:blur(4px);
}

/* ===== 粒子 ===== */
.particle{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#65f5ff;
    box-shadow:0 0 10px #00eaff;
    pointer-events:none;
}

/* ===== 開始畫面 ===== */
.overlay{
    position:absolute;
    z-index:200;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle,rgba(0,220,255,.12),rgba(0,0,0,.85));
    backdrop-filter:blur(5px);
}

.panel{
    width:min(520px,90vw);
    padding:42px 35px;
    text-align:center;
    border-radius:28px;
    border:1px solid rgba(0,230,255,.5);
    background:rgba(3,10,30,.8);
    box-shadow:
        0 0 40px rgba(0,220,255,.2),
        inset 0 0 40px rgba(120,0,255,.08);
}

.title{
    font-size:42px;
    font-weight:900;
    letter-spacing:5px;
    background:linear-gradient(90deg,#fff,#62f3ff,#bd5cff,#fff);
    background-size:250%;
    -webkit-background-clip:text;
    color:transparent;
    animation:titleMove 4s infinite linear;
    text-shadow:0 0 25px rgba(0,220,255,.3);
}

@keyframes titleMove{
    from{background-position:0}
    to{background-position:250%}
}

.subtitle{
    margin-top:12px;
    color:#91dff0;
    letter-spacing:3px;
}

button{
    margin-top:25px;
    padding:13px 28px;
    border:1px solid #55eaff;
    border-radius:15px;
    background:rgba(0,180,255,.12);
    color:white;
    font-size:17px;
    cursor:pointer;
    box-shadow:0 0 15px rgba(0,220,255,.3);
    transition:.2s;
}

button:hover{
    transform:translateY(-2px) scale(1.03);
    background:rgba(0,220,255,.25);
    box-shadow:0 0 30px rgba(0,220,255,.65);
}

.level-buttons{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:18px;
}

.level-buttons button{
    margin-top:0;
}

/* ===== 控制提示 ===== */
#controls{
    position:absolute;
    z-index:110;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    padding:8px 18px;
    border-radius:15px;
    background:rgba(0,0,0,.4);
    border:1px solid rgba(120,230,255,.25);
    color:#9cefff;
    font-size:13px;
}

/* ===== 手機按鍵 ===== */
#mobileControls{
    display:none;
}

/* ===== 勝利 ===== */
.success{
    font-size:26px;
    color:#7effff;
    text-shadow:0 0 15px #00eaff;
}

/* ===== 響應式 ===== */
@media(max-width:700px){
    .title{
        font-size:30px;
    }

    #hud{
        font-size:13px;
        padding:9px 12px;
    }

    #controls{
        bottom:85px;
    }

    #mobileControls{
        display:flex;
        position:absolute;
        z-index:150;
        bottom:15px;
        left:0;
        right:0;
        justify-content:space-between;
        padding:0 20px;
        pointer-events:none;
    }

    .mobile-group{
        display:flex;
        gap:10px;
        pointer-events:auto;
    }

    .mobile-btn{
        width:58px;
        height:58px;
        margin:0;
        border-radius:50%;
        font-size:22px;
        padding:0;
    }
}
</style>
</head>

<div id="game">

    <div id="hud">

            <p style="margin-top:25px;color:#b9dce8;line-height:1.8">

</div>

===================================================== */

}

/* =====================================================
   清除世界
===================================================== */

function clearWorld(){

    document.querySelectorAll(
        ".platform,.coin,.hazard,.laser,.flag,.particle"
    ).forEach(e=>e.remove());

}


/* =====================================================
   建立關卡
===================================================== */

function loadLevel(index){

    currentLevel=index;

    clearWorld();

    const data=levels[index];

    levelNameEl.textContent=data.name;

    player.x=data.player.x;
    player.y=data.player.y;

    player.vx=0;
    player.vy=0;

    player.jumps=0;

    coins=0;

    platforms=[];
    coinObjects=[];
    hazards=[];
    movingPlatforms=[];

    /* 平台 */

    data.platforms.forEach(p=>{

        const el=document.createElement("div");

        el.className="platform";

        el.style.left=p[0]+"px";
        el.style.top=p[1]+"px";
        el.style.width=p[2]+"px";

        world.appendChild(el);

        platforms.push({
            x:p[0],
            y:p[1],
            w:p[2],
            h:18,
            el:el
        });

    });


    /* 金幣 */

    data.coins.forEach(c=>{

        const el=document.createElement("div");

        el.className="coin";

        el.style.left=c[0]+"px";
        el.style.top=c[1]+"px";

        world.appendChild(el);

        coinObjects.push({
            x:c[0],
            y:c[1],
            w:23,
            h:23,
            el:el,
            collected:false
        });

    });

    totalCoins=coinObjects.length;

    coinTotalEl.textContent=totalCoins;


    /* 危險 */

    data.hazards.forEach(h=>{

        const el=document.createElement("div");

        el.className="hazard";

        el.style.left=h[0]+"px";
        el.style.top=h[1]+"px";
        el.style.width=h[2]+"px";

        world.appendChild(el);

        hazards.push({
            x:h[0],
            y:h[1],
            w:h[2],
            h:14,
            el:el
        });

    });


    /* 移動平台 */

    data.moving.forEach(m=>{

        const el=document.createElement("div");

        el.className="platform moving";

        el.style.left=m[0]+"px";
        el.style.top=m[1]+"px";
        el.style.width=m[2]+"px";

        world.appendChild(el);

        movingPlatforms.push({
            x:m[0],
            y:m[1],
            w:m[2],
            h:18,
            startX:m[0],
            startY:m[1],
            range:m[3],
            speed:m[4]/1000,
            phase:Math.random()*Math.PI*2,
            oldX:m[0],
            oldY:m[1],
            dx:0,
            dy:0,
            el:el
        });

    });


    /* 終點 */

    const g=data.goal;

    const flag=document.createElement("div");

    flag.className="flag";

    flag.style.left=g[0]+"px";
    flag.style.top=g[1]+"px";

    world.appendChild(flag);

    goal={
        x:g[0],
        y:g[1],
        w:60,
        h:80,
        el:flag
    };


    updateHUD();

}


/* =====================================================
   開始遊戲
===================================================== */

function startGame(index){

    loadLevel(index);

    lives=3;

    gameRunning=true;

    startScreen.style.display="none";
    deathScreen.style.display="none";
    winScreen.style.display="none";

}


/* =====================================================
   重新開始
===================================================== */

function restartGame(){

    loadLevel(currentLevel);

    gameRunning=true;

    deathScreen.style.display="none";
    winScreen.style.display="none";

}


/* =====================================================
   下一關
===================================================== */

function nextLevel(){

    if(currentLevel<levels.length-1){

        startGame(currentLevel+1);

    }else{

        startGame(0);

    }

}


/* =====================================================
   鍵盤
===================================================== */

window.addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if(
        ["arrowup","arrowleft","arrowright"," ","w","a","d"].includes(
            e.key.toLowerCase()
        )
    ){
        e.preventDefault();
    }

    if(
        (e.key===" " ||
        e.key.toLowerCase()==="w" ||
        e.key==="ArrowUp") &&
        !e.repeat
    ){
        jump();
    }

});


window.addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()]=false;

});


/* =====================================================
   跳躍 / 二段跳
===================================================== */

function jump(){

    if(!gameRunning)return;

    if(player.jumps<2){

        player.vy=player.jumpPower;

        player.jumps++;

        createJumpParticles();

    }

}


/* =====================================================
   手機按鍵
===================================================== */

function mobileHold(button,key){

    button.addEventListener("touchstart",e=>{
        e.preventDefault();
        keys[key]=true;
    });

    button.addEventListener("touchend",e=>{
        e.preventDefault();
        keys[key]=false;
    });

}

mobileHold(document.getElementById("leftBtn"),"arrowleft");
mobileHold(document.getElementById("rightBtn"),"arrowright");

document.getElementById("jumpBtn")
.addEventListener("touchstart",e=>{
    e.preventDefault();
    jump();
});


/* =====================================================
   碰撞
===================================================== */

function collision(a,b){

    return(
        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y
    );

}


/* =====================================================
   玩家移動
===================================================== */

function updatePlayer(dt){

    let left=
        keys["arrowleft"] ||
        keys["a"];

    let right=
        keys["arrowright"] ||
        keys["d"];


    /* 水平 */

    if(left){

        player.vx=-player.speed;

    }else if(right){

        player.vx=player.speed;

    }else{

        player.vx*=.82;

    }


    player.x+=player.vx;


    /* 重力 */

    player.vy+=player.gravity;

    player.y+=player.vy;


    player.grounded=false;


    /* 平台碰撞 */

    [...platforms,...movingPlatforms].forEach(p=>{

        if(
            player.vy>=0 &&
            player.x+player.w>p.x &&
            player.x<p.x+p.w &&
            player.y+player.h>=p.y &&
            player.y+player.h<=p.y+25
        ){

            player.y=p.y-player.h;

            player.vy=0;

            player.grounded=true;

            player.jumps=0;

        }

    });


    /* 邊界 */

    if(player.x<0){

        player.x=0;

    }


    /* 掉落 */

    if(player.y>700){

        die();

    }

}


/* =====================================================
   移動平台
===================================================== */

function updateMovingPlatforms(){

    const time=performance.now();

    movingPlatforms.forEach(p=>{

        p.oldX=p.x;
        p.oldY=p.y;

        p.x=
            p.startX+
            Math.sin(time*p.speed+p.phase)*p.range;

        p.y=
            p.startY+
            Math.sin(time*p.speed*.7+p.phase)*25;

        p.dx=p.x-p.oldX;
        p.dy=p.y-p.oldY;

        p.el.style.left=p.x+"px";
        p.el.style.top=p.y+"px";

    });

}


/* =====================================================
   金幣
===================================================== */

function checkCoins(){

    coinObjects.forEach(c=>{

        if(!c.collected && collision(player,c)){

            c.collected=true;

            c.el.remove();

            coins++;

            updateHUD();

            createCoinParticles(c.x,c.y);

        }

    });

}


/* =====================================================
   危險
===================================================== */

function checkHazards(){

    hazards.forEach(h=>{

        if(collision(player,h)){

            die();

        }

    });

}


/* =====================================================
   終點
===================================================== */

function checkGoal(){

    if(goal && collision(player,goal)){

        win();

    }

}


/* =====================================================
   死亡
===================================================== */

function die(){

    if(!gameRunning)return;

    gameRunning=false;

    lives--;

    lifeEl.textContent=lives;

    createExplosion(player.x,player.y);

    setTimeout(()=>{

        if(lives<=0){

            deathScreen.style.display="flex";

        }else{

            restartGame();

        }

    },400);

}


/* =====================================================
   勝利
===================================================== */

function win(){

    if(!gameRunning)return;

    gameRunning=false;

    winText.textContent=
        `本關收集 ${coins} / ${totalCoins} 枚能量金幣`;

    winScreen.style.display="flex";

    createExplosion(goal.x,goal.y);

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    coinCountEl.textContent=coins;
    coinTotalEl.textContent=totalCoins;
    lifeEl.textContent=lives;

}


/* =====================================================
   粒子
===================================================== */

function createParticle(x,y){

    const p=document.createElement("div");

    p.className="particle";

    p.style.left=x+"px";
    p.style.top=y+"px";

    world.appendChild(p);

    const angle=Math.random()*Math.PI*2;
    const speed=1+Math.random()*4;

    let life=30;

    function animate(){

        x+=Math.cos(angle)*speed;
        y+=Math.sin(angle)*speed;

        life--;

        p.style.left=x+"px";
        p.style.top=y+"px";
        p.style.opacity=life/30;

        if(life>0){

            requestAnimationFrame(animate);

        }else{

            p.remove();

        }

    }

    animate();

}


function createJumpParticles(){

    for(let i=0;i<7;i++){

        createParticle(
            player.x+player.w/2,
            player.y+player.h
        );

    }

}


function createCoinParticles(x,y){

    for(let i=0;i<12;i++){

        createParticle(x,y);

    }

}


function createExplosion(x,y){

    for(let i=0;i<35;i++){

        createParticle(x,y);

    }

}


/* =====================================================
   相機
===================================================== */

function updateCamera(){

    const screenCenter=window.innerWidth/2;

    cameraX=
        player.x-
        screenCenter+
        player.w/2;


    cameraX=Math.max(
        0,
        Math.min(
            cameraX,
            5000-window.innerWidth
        )
    );


    world.style.transform=
        `translateX(${-cameraX}px)`;

}


/* =====================================================
   玩家顯示
===================================================== */

function render(){

    playerEl.style.left=player.x+"px";
    playerEl.style.top=player.y+"px";

}


/* =====================================================
   遊戲迴圈
===================================================== */

function gameLoop(time){

    const dt=Math.min(
        (time-lastTime)/16.67,
        2
    );

    lastTime=time;

    if(gameRunning){

        updateMovingPlatforms();

        updatePlayer(dt);

        checkCoins();

        checkHazards();

        checkGoal();

        updateCamera();

        render();

    }

    requestAnimationFrame(gameLoop);

}

requestAnimationFrame(gameLoop);


/* =====================================================
   初始畫面
===================================================== */

loadLevel(0);

</script>

</html>


<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>讓AI解決我的生活大小事_3D太陽系</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    color:#fff;
}

#scene{
    position:fixed;
    inset:0;
}

/* 星空背景 */
#stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 20% 30%,rgba(255,255,255,.8) 0 1px,transparent 2px),
        radial-gradient(circle at 70% 20%,rgba(255,255,255,.7) 0 1px,transparent 2px),
        radial-gradient(circle at 40% 80%,rgba(255,255,255,.6) 0 1px,transparent 2px),
        radial-gradient(circle at 85% 75%,rgba(255,255,255,.8) 0 1px,transparent 2px),
        radial-gradient(circle at 55% 55%,rgba(255,255,255,.5) 0 1px,transparent 2px),
        #000;
    background-size:
        180px 180px,
        260px 260px,
        310px 310px,
        390px 390px,
        470px 470px;
    opacity:.75;
}

/* 標題 */
#title{
    position:fixed;
    top:25px;
    left:30px;
    z-index:10;
    pointer-events:none;
}

#title h1{
    margin:0;
    font-size:28px;
    letter-spacing:5px;
    font-weight:500;
    text-shadow:0 0 15px rgba(255,255,255,.4);
}

#title p{
    margin:6px 0 0;
    color:#8fa8c7;
    font-size:13px;
    letter-spacing:2px;
}

/* 控制面板 */
#controlPanel{
    position:fixed;
    left:25px;
    bottom:25px;
    width:280px;
    padding:18px;
    z-index:20;

    background:rgba(8,12,20,.78);
    border:1px solid rgba(120,170,220,.25);
    border-radius:16px;
    backdrop-filter:blur(12px);
    box-shadow:
        0 10px 40px rgba(0,0,0,.5),
        inset 0 0 20px rgba(80,140,200,.05);
}

.controlTitle{
    font-size:14px;
    color:#8fb9e6;
    margin-bottom:12px;
    letter-spacing:2px;
}

#pauseBtn{
    width:100%;
    padding:10px;
    border:1px solid rgba(130,180,230,.4);
    border-radius:9px;
    background:rgba(40,70,100,.4);
    color:white;
    cursor:pointer;
    font-size:14px;
    transition:.2s;
}

#pauseBtn:hover{
    background:rgba(80,130,180,.5);
    box-shadow:0 0 15px rgba(100,180,255,.25);
}

.speedRow{
    margin-top:15px;
}

.speedRow label{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:#aebed0;
    margin-bottom:7px;
}

#speed{
    width:100%;
    accent-color:#64b5ff;
}

/* 行星資訊 */
#infoPanel{
    position:fixed;
    right:25px;
    top:25px;
    width:290px;
    z-index:20;

    padding:20px;

    background:rgba(7,11,18,.82);
    border:1px solid rgba(120,170,220,.3);
    border-radius:16px;

    backdrop-filter:blur(14px);

    box-shadow:0 15px 45px rgba(0,0,0,.55);

    transform:translateX(320px);
    opacity:0;
    transition:.35s ease;
}

#infoPanel.show{
    transform:translateX(0);
    opacity:1;
}

#infoPanel h2{
    margin:0 0 5px;
    font-size:24px;
}

.infoSubtitle{
    color:#7892ad;
    font-size:12px;
    margin-bottom:18px;
}

.infoLine{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid rgba(255,255,255,.07);
    font-size:13px;
}

.infoLine span:first-child{
    color:#8296aa;
}

.infoLine span:last-child{
    color:#e4edf7;
}

#closeInfo{
    position:absolute;
    top:10px;
    right:12px;
    border:0;
    background:none;
    color:#7892ad;
    font-size:20px;
    cursor:pointer;
}

/* 底部提示 */
#hint{
    position:fixed;
    right:25px;
    bottom:25px;
    color:#65788c;
    font-size:12px;
    z-index:10;
    letter-spacing:1px;
}

/* RWD */
@media(max-width:700px){
    #title{
        top:15px;
        left:15px;
    }

    #title h1{
        font-size:20px;
    }

    #controlPanel{
        left:15px;
        bottom:15px;
        width:240px;
    }

    #infoPanel{
        right:15px;
        top:15px;
        width:250px;
    }

    #hint{
        display:none;
    }
}
</style>
</head>

<body>

<div id="stars"></div>

<div id="scene"></div>

<div id="title">
    <h1>讓AI解決我的生活大小事_3D太陽系</h1>
</div>

<div id="controlPanel">

    <div class="controlTitle">控制面板</div>

    <button id="pauseBtn">⏸ 暫停模擬</button>

    <div class="speedRow">
        <label>
            <span>模擬速度</span>
            <span id="speedValue">1.0×</span>
        </label>

        <input
            type="range"
            id="speed"
            min="0.1"
            max="5"
            step="0.1"
            value="1">
    </div>

</div>

<div id="infoPanel">

    <button id="closeInfo">×</button>

    <h2 id="planetName">地球</h2>

    <div class="infoSubtitle" id="planetType">
        EARTH
    </div>

    <div class="infoLine">
        <span>與太陽距離</span>
        <span id="distance">1.00 AU</span>
    </div>

    <div class="infoLine">
        <span>公轉週期</span>
        <span id="period">365 天</span>
    </div>

    <div class="infoLine">
        <span>行星類型</span>
        <span id="type">岩石行星</span>
    </div>

    <div class="infoLine">
        <span>衛星</span>
        <span id="moons">1</span>
    </div>

</div>

<div id="hint">
    拖曳旋轉視角　•　滾輪縮放　•　點擊行星查看資訊
</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =====================================================
   1. 基本設定
===================================================== */

const sceneContainer = document.getElementById("scene");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    55,
    window.innerWidth / window.innerHeight,
    0.1,
    3000
);

camera.position.set(0,80,180);

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    alpha:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.outputEncoding = THREE.sRGBEncoding;

sceneContainer.appendChild(renderer.domElement);


/* =====================================================
   2. 光源
===================================================== */

const ambientLight = new THREE.AmbientLight(
    0x222222,
    0.35
);

scene.add(ambientLight);

const sunLight = new THREE.PointLight(
    0xffffff,
    3,
    1000
);

scene.add(sunLight);


/* =====================================================
   3. 太陽
===================================================== */

const sunGeometry =
    new THREE.SphereGeometry(10,64,64);

const sunMaterial =
    new THREE.MeshBasicMaterial({
        color:0xffcc33
    });

const sun =
    new THREE.Mesh(
        sunGeometry,
        sunMaterial
    );

scene.add(sun);


/* 太陽光暈 */

const glowGeometry =
    new THREE.SphereGeometry(13,64,64);

const glowMaterial =
    new THREE.MeshBasicMaterial({
        color:0xff8800,
        transparent:true,
        opacity:.15,
        blending:THREE.AdditiveBlending,
        depthWrite:false
    });

const sunGlow =
    new THREE.Mesh(
        glowGeometry,
        glowMaterial
    );

scene.add(sunGlow);


/* =====================================================
   4. 行星資料
===================================================== */

const planetsData = [

    {
        name:"水星",
        english:"MERCURY",
        color:0xaaa7a1,
        size:1.4,
        distance:18,
        speed:0.020,
        period:"88 天",
        type:"岩石行星",
        moons:"0"
    },

    {
        name:"金星",
        english:"VENUS",
        color:0xe5a15a,
        size:2.2,
        distance:28,
        speed:0.015,
        period:"225 天",
        type:"岩石行星",
        moons:"0"
    },

    {
        name:"地球",
        english:"EARTH",
        color:0x3d8bff,
        size:2.5,
        distance:39,
        speed:0.011,
        period:"365 天",
        type:"岩石行星",
        moons:"1"
    },

    {
        name:"火星",
        english:"MARS",
        color:0xd9573f,
        size:1.9,
        distance:50,
        speed:0.009,
        period:"687 天",
        type:"岩石行星",
        moons:"2"
    },

    {
        name:"木星",
        english:"JUPITER",
        color:0xd8b38a,
        size:6.2,
        distance:68,
        speed:0.005,
        period:"11.86 年",
        type:"氣體巨行星",
        moons:"95+"
    },

    {
        name:"土星",
        english:"SATURN",
        color:0xe0c58c,
        size:5.2,
        distance:88,
        speed:0.0038,
        period:"29.45 年",
        type:"氣體巨行星",
        moons:"140+"
    },

    {
        name:"天王星",
        english:"URANUS",
        color:0x79d8df,
        size:3.5,
        distance:108,
        speed:0.0027,
        period:"84 年",
        type:"冰巨行星",
        moons:"28"
    },

    {
        name:"海王星",
        english:"NEPTUNE",
        color:0x426ee8,
        size:3.4,
        distance:128,
        speed:0.0022,
        period:"164.8 年",
        type:"冰巨行星",
        moons:"16"
    }

];


/* =====================================================
   5. 建立星球
===================================================== */

const planets = [];

planetsData.forEach((data,index)=>{

    const geometry =
        new THREE.SphereGeometry(
            data.size,
            32,
            32
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:data.color,
            roughness:.75,
            metalness:.05
        });

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.userData = data;

    mesh.userData.angle =
        Math.random() * Math.PI * 2;

    mesh.position.x =
        Math.cos(mesh.userData.angle) *
        data.distance;

    mesh.position.z =
        Math.sin(mesh.userData.angle) *
        data.distance;

    scene.add(mesh);


    /* -------------------------------------------------
       土星環
    ------------------------------------------------- */

    if(data.name === "土星"){

        const ringGeometry =
            new THREE.RingGeometry(
                data.size * 1.35,
                data.size * 2.25,
                80
            );

        const ringMaterial =
            new THREE.MeshBasicMaterial({
                color:0xcbb98b,
                side:THREE.DoubleSide,
                transparent:true,
                opacity:.7
            });

        const ring =
            new THREE.Mesh(
                ringGeometry,
                ringMaterial
            );

        ring.rotation.x =
            Math.PI / 2.5;

        mesh.add(ring);
    }


    /* -------------------------------------------------
       軌道
    ------------------------------------------------- */

    const points = [];

    for(let i=0;i<=128;i++){

        const angle =
            (i/128) *
            Math.PI *
            2;

        points.push(
            new THREE.Vector3(
                Math.cos(angle) *
                data.distance,
                0,
                Math.sin(angle) *
                data.distance
            )
        );
    }

    const orbitGeometry =
        new THREE.BufferGeometry()
            .setFromPoints(points);

    const orbitMaterial =
        new THREE.LineBasicMaterial({
            color:0x486070,
            transparent:true,
            opacity:.35
        });

    const orbit =
        new THREE.LineLoop(
            orbitGeometry,
            orbitMaterial
        );

    scene.add(orbit);


    planets.push(mesh);

});


/* =====================================================
   6. 行星標籤
===================================================== */

function createLabel(text){

    const canvas =
        document.createElement("canvas");

    canvas.width = 256;
    canvas.height = 64;

    const ctx =
        canvas.getContext("2d");

    ctx.font =
        "28px Microsoft JhengHei";

    ctx.fillStyle =
        "rgba(255,255,255,.9)";

    ctx.textAlign =
        "center";

    ctx.fillText(
        text,
        128,
        40
    );

    const texture =
        new THREE.CanvasTexture(canvas);

    const material =
        new THREE.SpriteMaterial({
            map:texture,
            transparent:true
        });

    const sprite =
        new THREE.Sprite(material);

    sprite.scale.set(
        14,
        3.5,
        1
    );

    sprite.position.y = 5;

    return sprite;
}


/* 每顆行星建立標籤 */

planets.forEach(planet=>{

    const label =
        createLabel(
            planet.userData.name
        );

    planet.add(label);

});


/* =====================================================
   7. 滑鼠點擊
===================================================== */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();

renderer.domElement.addEventListener(
    "click",
    function(event){

        mouse.x =
            (event.clientX /
            window.innerWidth) * 2 - 1;

        mouse.y =
            -(event.clientY /
            window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(
            mouse,
            camera
        );

        const intersects =
            raycaster.intersectObjects(
                planets
            );

        if(intersects.length > 0){

            const planet =
                intersects[0].object;

            showPlanetInfo(
                planet.userData
            );
        }

    }
);


/* =====================================================
   8. 資訊面板
===================================================== */

function showPlanetInfo(data){

    document.getElementById(
        "planetName"
    ).textContent =
        data.name;

    document.getElementById(
        "planetType"
    ).textContent =
        data.english;

    document.getElementById(
        "distance"
    ).textContent =
        (data.distance / 39).toFixed(2)
        + " AU";

    document.getElementById(
        "period"
    ).textContent =
        data.period;

    document.getElementById(
        "type"
    ).textContent =
        data.type;

    document.getElementById(
        "moons"
    ).textContent =
        data.moons;

    document.getElementById(
        "infoPanel"
    ).classList.add("show");
}


document.getElementById(
    "closeInfo"
).onclick = function(){

    document.getElementById(
        "infoPanel"
    ).classList.remove("show");

};


/* =====================================================
   9. 暫停與速度
===================================================== */

let paused = false;

let simulationSpeed = 1;

const pauseBtn =
    document.getElementById(
        "pauseBtn"
    );

pauseBtn.onclick = function(){

    paused = !paused;

    pauseBtn.textContent =
        paused
        ? "▶ 繼續模擬"
        : "⏸ 暫停模擬";

};


const speed =
    document.getElementById(
        "speed"
    );

const speedValue =
    document.getElementById(
        "speedValue"
    );

speed.oninput = function(){

    simulationSpeed =
        parseFloat(this.value);

    speedValue.textContent =
        simulationSpeed.toFixed(1)
        + "×";

};


/* =====================================================
   10. 3D 視角控制
===================================================== */

let isDragging = false;

let previousMouse = {
    x:0,
    y:0
};

let rotationX = 0.3;
let rotationY = 0;

renderer.domElement.addEventListener(
    "mousedown",
    function(e){

        isDragging = true;

        previousMouse.x =
            e.clientX;

        previousMouse.y =
            e.clientY;

    }
);

window.addEventListener(
    "mouseup",
    function(){

        isDragging = false;

    }
);

window.addEventListener(
    "mousemove",
    function(e){

        if(!isDragging) return;

        const dx =
            e.clientX -
            previousMouse.x;

        const dy =
            e.clientY -
            previousMouse.y;

        rotationY += dx * .005;

        rotationX += dy * .005;

        rotationX =
            Math.max(
                -.9,
                Math.min(
                    .9,
                    rotationX
                )
            );

        previousMouse.x =
            e.clientX;

        previousMouse.y =
            e.clientY;

    }
);


/* =====================================================
   11. 滾輪縮放
===================================================== */

let cameraDistance = 180;

renderer.domElement.addEventListener(
    "wheel",
    function(e){

        cameraDistance +=
            e.deltaY * .08;

        cameraDistance =
            Math.max(
                50,
                Math.min(
                    450,
                    cameraDistance
                )
            );

    }
);


/* =====================================================
   12. 動畫
===================================================== */

const clock =
    new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta =
        clock.getDelta();

    if(!paused){

        planets.forEach(
            planet=>{

                const data =
                    planet.userData;

                data.angle +=
                    data.speed *
                    simulationSpeed;

                planet.position.x =
                    Math.cos(
                        data.angle
                    ) *
                    data.distance;

                planet.position.z =
                    Math.sin(
                        data.angle
                    ) *
                    data.distance;

                planet.rotation.y +=
                    .01 *
                    simulationSpeed;

            }
        );

        sun.rotation.y +=
            .001 *
            simulationSpeed;

        sunGlow.scale.setScalar(
            1 +
            Math.sin(
                performance.now() *
                .002
            ) * .03
        );

    }


    /* 相機環繞 */

    const x =
        Math.sin(rotationY) *
        Math.cos(rotationX) *
        cameraDistance;

    const y =
        Math.sin(rotationX) *
        cameraDistance;

    const z =
        Math.cos(rotationY) *
        Math.cos(rotationX) *
        cameraDistance;

    camera.position.set(
        x,
        y,
        z
    );

    camera.lookAt(
        0,
        0,
        0
    );


    renderer.render(
        scene,
        camera
    );

}

animate();


/* =====================================================
   13. 視窗大小變化
===================================================== */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>讓AI解決我的生活大小事_吃月餅</title>


<style>

/* ==================================================
   基本設定
================================================== */

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    touch-action: none;

    font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;

}


body {

    background:
        radial-gradient(
            circle at 50% 20%,
            #394a8a 0%,
            #151936 45%,
            #070914 100%
        );

    color: white;

}


/* ==================================================
   星空
================================================== */

.star {

    position: fixed;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: white;

    opacity: 0.8;

    animation:
        twinkle 2s infinite alternate;

}


@keyframes twinkle {

    from {
        opacity: 0.2;
        transform: scale(0.7);
    }

    to {
        opacity: 1;
        transform: scale(1.4);
    }

}


/* ==================================================
   月亮
================================================== */

.moon {

    position: fixed;

    top: 5vh;
    right: 6vw;

    width: clamp(60px, 15vw, 110px);
    height: clamp(60px, 15vw, 110px);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fffde8,
            #ffe58a 60%,
            #ffc85c
        );

    box-shadow:
        0 0 25px #fff1a8,
        0 0 60px rgba(255,230,120,0.6);

    z-index: 0;

}


/* ==================================================
   遊戲區
================================================== */

.game {

    position: relative;

    width: min(900px, 100vw);

    height: 100dvh;

    margin: 0 auto;

    overflow: hidden;

    background:
        linear-gradient(
            rgba(20,25,60,0.45),
            rgba(5,8,25,0.7)
        );

    border:
        1px solid rgba(255,255,255,0.15);

    box-shadow:
        inset 0 0 40px
        rgba(100,130,255,0.15);

    touch-action: none;

}


/* ==================================================
   標題
================================================== */

.title {

    position: absolute;

    top: clamp(12px, 2vh, 25px);

    left: 0;

    width: 100%;

    text-align: center;

    font-size:
        clamp(20px, 6vw, 36px);

    font-weight: bold;

    text-shadow:
        0 0 10px #fff,
        0 0 25px #8ab4ff;

    z-index: 10;

}


/* ==================================================
   資訊列
================================================== */

.info {

    position: absolute;

    top: clamp(55px, 9vh, 80px);

    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    gap: clamp(4px, 2vw, 12px);

    width: 95%;

    justify-content: center;

    z-index: 10;

}


.info-box {

    flex: 1;

    max-width: 130px;

    min-width: 0;

    padding:
        5px
        clamp(5px, 2vw, 14px);

    text-align: center;

    border:
        1px solid
        rgba(255,255,255,0.25);

    border-radius: 12px;

    background:
        rgba(255,255,255,0.08);

    box-shadow:
        0 0 15px
        rgba(130,160,255,0.15);

    font-size:
        clamp(11px, 3vw, 15px);

}


.info-value {

    margin-top: 2px;

    font-size:
        clamp(16px, 5vw, 23px);

    font-weight: bold;

    color: #ffe88a;

}


/* ==================================================
   掉落月餅
================================================== */

.mooncake {

    position: absolute;

    width:
        clamp(48px, 13vw, 65px);

    height:
        clamp(48px, 13vw, 65px);

    display: flex;

    justify-content: center;
    align-items: center;

    font-size:
        clamp(32px, 10vw, 45px);

    border-radius: 50%;

    z-index: 5;

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,210,100,0.8)
        );

    animation:
        rotateMooncake
        1.5s
        ease-in-out
        infinite;

}


@keyframes rotateMooncake {

    0% {
        transform: rotate(-8deg);
    }

    50% {
        transform: rotate(8deg);
    }

    100% {
        transform: rotate(-8deg);
    }

}


/* ==================================================
   炸彈
================================================== */

.bomb {

    filter:
        drop-shadow(
            0 0 12px red
        );

}


/* ==================================================
   玩家
================================================== */

.player {

    position: absolute;

    bottom:
        clamp(45px, 9vh, 75px);

    width:
        clamp(75px, 23vw, 115px);

    height:
        clamp(55px, 16vw, 75px);

    display: flex;

    justify-content: center;
    align-items: center;

    font-size:
        clamp(48px, 18vw, 68px);

    z-index: 8;

    filter:
        drop-shadow(
            0 0 10px
            rgba(255,255,255,0.7)
        );

    will-change:
        left,
        transform;

    transition:
        transform 0.08s;

}


/* ==================================================
   地面
================================================== */

.ground {

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;

    height: 12px;

    background:
        linear-gradient(
            90deg,
            #6f54ff,
            #54c8ff,
            #c76cff,
            #6f54ff
        );

    box-shadow:
        0 0 20px #6f54ff;

    z-index: 7;

}


/* ==================================================
   提示文字
================================================== */

.hint {

    position: absolute;

    bottom: 25px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 90%;

    text-align: center;

    font-size:
        clamp(11px, 3vw, 14px);

    color:
        rgba(255,255,255,0.65);

    z-index: 9;

}


/* ==================================================
   開始 / 結束畫面
================================================== */

.start-screen,
.game-over {

    position: absolute;

    inset: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 20px;

    background:
        rgba(5,8,25,0.78);

    backdrop-filter:
        blur(8px);

    z-index: 20;

}


.panel {

    width: min(500px, 94vw);

    max-height: 90vh;

    overflow-y: auto;

    padding:
        clamp(22px, 6vw, 35px);

    text-align: center;

    border:
        1px solid
        rgba(255,255,255,0.2);

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            rgba(70,80,160,0.3),
            rgba(20,20,60,0.7)
        );

    box-shadow:
        0 0 40px
        rgba(110,130,255,0.3);

}


.panel h2 {

    margin-top: 0;

    font-size:
        clamp(26px, 8vw, 36px);

    text-shadow:
        0 0 15px #9bbcff;

}


.panel p {

    line-height: 1.7;

    font-size:
        clamp(13px, 4vw, 16px);

    color: #dfe7ff;

}


/* ==================================================
   開始按鈕
================================================== */

.start-button {

    margin-top: 10px;

    width: min(280px, 80vw);

    min-height: 55px;

    padding: 12px 25px;

    border: none;

    border-radius: 30px;

    background:
        linear-gradient(
            90deg,
            #7567ff,
            #4dc9ff
        );

    color: white;

    font-size:
        clamp(17px, 5vw, 21px);

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 0 20px
        rgba(80,180,255,0.5);

}


/* ==================================================
   隱藏
================================================== */

.hidden {

    display: none !important;

}


/* ==================================================
   手機控制按鈕
================================================== */

.mobile-controls {

    position: fixed;

    left: 0;
    right: 0;

    bottom:
        max(12px, env(safe-area-inset-bottom));

    display: flex;

    justify-content: center;

    gap: 30px;

    z-index: 30;

    pointer-events: none;

}


.control-btn {

    width:
        clamp(65px, 20vw, 90px);

    height:
        clamp(55px, 16vw, 70px);

    border:
        1px solid
        rgba(255,255,255,0.35);

    border-radius: 20px;

    background:
        rgba(40,50,100,0.78);

    color: white;

    font-size:
        clamp(25px, 8vw, 35px);

    cursor: pointer;

    touch-action: none;

    pointer-events: auto;

    box-shadow:
        0 0 20px
        rgba(100,150,255,0.35);

}


.control-btn:active {

    transform: scale(0.9);

    background:
        rgba(90,110,200,0.9);

}


/* ==================================================
   電腦版隱藏手機按鈕
================================================== */

@media (min-width: 800px) {

    .mobile-controls {

        display: none;

    }

}


/* ==================================================
   橫向手機
================================================== */

@media (
    max-height: 500px
) and (
    orientation: landscape
) {

    .title {

        top: 5px;

        font-size: 22px;

    }

    .info {

        top: 38px;

    }

    .player {

        bottom: 35px;

    }

    .hint {

        display: none;

    }

}


/* ==================================================
   防止 iPhone 安全區域
================================================== */

@supports (
    padding: env(safe-area-inset-bottom)
) {

    .game {

        padding-bottom:
            env(safe-area-inset-bottom);

    }

}

</style>

</head>


<body>


<!-- ==================================================
     星空
================================================== -->

<div class="star"
     style="left:10%;top:15%;">
</div>

<div class="star"
     style="left:18%;top:30%;">
</div>

<div class="star"
     style="left:28%;top:10%;">
</div>

<div class="star"
     style="left:42%;top:22%;">
</div>

<div class="star"
     style="left:55%;top:8%;">
</div>

<div class="star"
     style="left:65%;top:28%;">
</div>

<div class="star"
     style="left:78%;top:17%;">
</div>

<div class="star"
     style="left:88%;top:35%;">
</div>

<div class="star"
     style="left:94%;top:10%;">
</div>

<div class="star"
     style="left:35%;top:42%;">
</div>


<!-- 月亮 -->

<div class="moon"></div>


<!-- ==================================================
     遊戲區
================================================== -->

<div
    class="game"
    id="game"
>


    <!-- 標題 -->

    <div class="title">

        🌕讓AI解決我的生活大小事_吃月餅大賽

    </div>


    <!-- ==================================================
         遊戲資訊
    ================================================== -->

    <div class="info">


        <div class="info-box">

            分數

            <div
                class="info-value"
                id="score"
            >
                0
            </div>

        </div>


        <div class="info-box">

            時間

            <div
                class="info-value"
                id="time"
            >
                60
            </div>

        </div>


        <div class="info-box">

            生命

            <div
                class="info-value"
                id="lives"
            >
                ❤️❤️❤️
            </div>

        </div>


    </div>


    <!-- ==================================================
         開始畫面
    ================================================== -->

    <div
        class="start-screen"
        id="startScreen"
    >

        <div class="panel">


            <h2>
                🥮 吃月餅！
            </h2>


            <p>

                月餅正在從天上掉下來！

                <br>

                快控制嘴巴把月餅吃掉！

            </p>


            <p>

                🥮 月餅：+10 分

                <br>

                💣 炸彈：-20 分

                <br>

                ❤️ 共有 3 次生命

            </p>


            <p>

                📱 手機：
                <b>手指左右滑動</b>

                <br>

                也可以使用下方
                ◀ ▶ 按鈕

            </p>


            <p>

                💻 電腦：

                <br>

                按住
                <b>← →</b>
                或
                <b>A / D</b>

            </p>


            <button
                class="start-button"
                id="startButton"
            >

                開始吃月餅！

            </button>


        </div>

    </div>


    <!-- ==================================================
         遊戲結束
    ================================================== -->

    <div
        class="game-over hidden"
        id="gameOver"
    >

        <div class="panel">


            <h2>
                🌕 遊戲結束
            </h2>


            <p>
                本次得分
            </p>


            <div
                id="finalScore"
                style="
                    font-size:50px;
                    color:#ffe88a;
                    font-weight:bold;
                "
            >
                0
            </div>


            <p id="bestText"></p>


            <button
                class="start-button"
                id="restartButton"
            >

                再玩一次

            </button>


        </div>

    </div>


    <!-- ==================================================
         玩家
    ================================================== -->

    <div
        class="player"
        id="player"
    >
        👄
    </div>


    <!-- 提示 -->

    <div class="hint">

        🥮 接月餅　💣 小心炸彈！

    </div>


    <!-- 地面 -->

    <div class="ground"></div>


</div>


<!-- ==================================================
     手機左右控制
================================================== -->

<div class="mobile-controls">


    <button
        class="control-btn"
        id="leftButton"
    >
        ◀
    </button>


    <button
        class="control-btn"
        id="rightButton"
    >
        ▶
    </button>


</div>


<script>

/* ==================================================
   取得元素
================================================== */

const game =
    document.getElementById(
        "game"
    );

const player =
    document.getElementById(
        "player"
    );

const scoreText =
    document.getElementById(
        "score"
    );

const timeText =
    document.getElementById(
        "time"
    );

const livesText =
    document.getElementById(
        "lives"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const gameOver =
    document.getElementById(
        "gameOver"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const restartButton =
    document.getElementById(
        "restartButton"
    );

const finalScore =
    document.getElementById(
        "finalScore"
    );

const bestText =
    document.getElementById(
        "bestText"
    );

const leftButton =
    document.getElementById(
        "leftButton"
    );

const rightButton =
    document.getElementById(
        "rightButton"
    );


/* ==================================================
   遊戲資料
================================================== */

let score = 0;

let time = 60;

let lives = 3;

let playerX = 0;

let gameRunning = false;

let items = [];

let gameTimer = null;

let createTimer = null;


/* ==================================================
   控制狀態
================================================== */

let keyLeft = false;

let keyRight = false;


/* ==================================================
   玩家移動速度
================================================== */

const moveSpeed = 9;


/* ==================================================
   最高分
================================================== */

let bestScore =
    Number(
        localStorage.getItem(
            "mooncakeBestScore"
        )
    ) || 0;


/* ==================================================
   初始化玩家
================================================== */

function resetPlayer() {

    playerX =
        (
            game.clientWidth -
            player.offsetWidth
        ) / 2;

    player.style.left =
        playerX + "px";

}


/* ==================================================
   開始遊戲
================================================== */

function startGame() {


    startScreen
        .classList
        .add("hidden");

    gameOver
        .classList
        .add("hidden");


    score = 0;

    time = 60;

    lives = 3;


    scoreText.textContent =
        score;

    timeText.textContent =
        time;

    livesText.textContent =
        "❤️❤️❤️";


    items.forEach(
        item =>
            item.element.remove()
    );

    items = [];


    resetPlayer();


    keyLeft = false;

    keyRight = false;


    gameRunning = true;


    clearInterval(
        gameTimer
    );

    clearInterval(
        createTimer
    );


    /* 倒數 */

    gameTimer =
        setInterval(
            function() {

                if (!gameRunning) {
                    return;
                }


                time--;


                timeText.textContent =
                    time;


                if (time <= 0) {

                    endGame();

                }

            },
            1000
        );


    /* 月餅產生 */

    createTimer =
        setInterval(
            createItem,
            600
        );

}


/* ==================================================
   建立月餅
================================================== */

function createItem() {


    if (!gameRunning) {
        return;
    }


    const item =
        document.createElement(
            "div"
        );


    const isBomb =
        Math.random() < 0.12;


    item.className =
        "mooncake" +
        (
            isBomb
                ? " bomb"
                : ""
        );


    item.textContent =
        isBomb
            ? "💣"
            : "🥮";


    const itemSize =
        Math.min(
            65,
            Math.max(
                48,
                game.clientWidth * 0.13
            )
        );


    const maxX =
        game.clientWidth -
        itemSize;


    const x =
        Math.random() *
        maxX;


    item.style.left =
        x + "px";


    item.style.top =
        "110px";


    game.appendChild(
        item
    );


    items.push({

        element: item,

        x: x,

        y: 110,

        speed:
            3 +
            Math.random() * 3,

        bomb: isBomb

    });

}


/* ==================================================
   玩家移動
================================================== */

function updatePlayerMovement() {


    if (!gameRunning) {
        return;
    }


    /* 左 */

    if (keyLeft) {

        playerX -=
            moveSpeed;

    }


    /* 右 */

    if (keyRight) {

        playerX +=
            moveSpeed;

    }


    /* 邊界 */

    const maxX =
        game.clientWidth -
        player.offsetWidth;


    if (playerX < 0) {

        playerX = 0;

    }


    if (playerX > maxX) {

        playerX = maxX;

    }


    player.style.left =
        playerX + "px";

}


/* ==================================================
   鍵盤按下
================================================== */

document.addEventListener(
    "keydown",
    function(event) {


        const key =
            event.key.toLowerCase();


        if (
            event.key ===
            "ArrowLeft" ||
            key === "a"
        ) {

            event.preventDefault();

            keyLeft = true;

        }


        if (
            event.key ===
            "ArrowRight" ||
            key === "d"
        ) {

            event.preventDefault();

            keyRight = true;

        }


        /* 空白鍵 */

        if (
            event.code ===
            "Space" &&
            !gameRunning
        ) {

            event.preventDefault();

            if (
                !startScreen
                    .classList
                    .contains("hidden")
            ) {

                startGame();

            }

        }

    }
);


/* ==================================================
   鍵盤放開
================================================== */

document.addEventListener(
    "keyup",
    function(event) {


        const key =
            event.key.toLowerCase();


        if (
            event.key ===
            "ArrowLeft" ||
            key === "a"
        ) {

            keyLeft = false;

        }


        if (
            event.key ===
            "ArrowRight" ||
            key === "d"
        ) {

            keyRight = false;

        }

    }
);


/* ==================================================
   視窗失焦
================================================== */

window.addEventListener(
    "blur",
    function() {

        keyLeft = false;

        keyRight = false;

    }
);


/* ==================================================
   手指滑動控制
================================================== */

let touchStartX = 0;

let touchPlayerStartX = 0;


/* 手指按下 */

game.addEventListener(
    "touchstart",
    function(event) {


        if (!gameRunning) {
            return;
        }


        const touch =
            event.touches[0];


        touchStartX =
            touch.clientX;


        touchPlayerStartX =
            playerX;

    },
    {
        passive: false
    }
);


/* 手指移動 */

game.addEventListener(
    "touchmove",
    function(event) {


        if (!gameRunning) {
            return;
        }


        event.preventDefault();


        const touch =
            event.touches[0];


        const moveX =
            touch.clientX -
            touchStartX;


        playerX =
            touchPlayerStartX +
            moveX;


        const maxX =
            game.clientWidth -
            player.offsetWidth;


        if (playerX < 0) {

            playerX = 0;

        }


        if (playerX > maxX) {

            playerX = maxX;

        }


        player.style.left =
            playerX + "px";

    },
    {
        passive: false
    }
);


/* ==================================================
   手機按鈕
================================================== */

function startMobileMove(
    direction
) {

    if (
        direction ===
        "left"
    ) {

        keyLeft = true;

    }


    if (
        direction ===
        "right"
    ) {

        keyRight = true;

    }

}


function stopMobileMove(
    direction
) {

    if (
        direction ===
        "left"
    ) {

        keyLeft = false;

    }


    if (
        direction ===
        "right"
    ) {

        keyRight = false;

    }

}


/* 左按鈕 */

leftButton.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        startMobileMove(
            "left"
        );

    }
);


leftButton.addEventListener(
    "pointerup",
    function() {

        stopMobileMove(
            "left"
        );

    }
);


leftButton.addEventListener(
    "pointercancel",
    function() {

        stopMobileMove(
            "left"
        );

    }
);


/* 右按鈕 */

rightButton.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        startMobileMove(
            "right"
        );

    }
);


rightButton.addEventListener(
    "pointerup",
    function() {

        stopMobileMove(
            "right"
        );

    }
);


rightButton.addEventListener(
    "pointercancel",
    function() {

        stopMobileMove(
            "right"
        );

    }
);


/* ==================================================
   滑鼠控制
================================================== */

game.addEventListener(
    "mousemove",
    function(event) {


        if (!gameRunning) {
            return;
        }


        /* 手機不使用滑鼠控制 */

        if (
            window.matchMedia(
                "(pointer: coarse)"
            ).matches
        ) {

            return;

        }


        const rect =
            game.getBoundingClientRect();


        playerX =
            event.clientX -
            rect.left -
            player.offsetWidth / 2;


        const maxX =
            game.clientWidth -
            player.offsetWidth;


        if (playerX < 0) {

            playerX = 0;

        }


        if (playerX > maxX) {

            playerX = maxX;

        }


        player.style.left =
            playerX + "px";

    }
);


/* ==================================================
   碰撞
================================================== */

function checkCollision(
    rect1,
    rect2
) {

    return (

        rect1.left <
        rect2.right &&

        rect1.right >
        rect2.left &&

        rect1.top <
        rect2.bottom &&

        rect1.bottom >
        rect2.top

    );

}


/* ==================================================
   遊戲主迴圈
================================================== */

function gameLoop() {


    /* 更新玩家 */

    updatePlayerMovement();


    if (gameRunning) {


        const playerRect =
            player.getBoundingClientRect();


        /* 倒序處理掉落物 */

        for (
            let i =
                items.length - 1;
            i >= 0;
            i--
        ) {


            const item =
                items[i];


            /* 掉落 */

            item.y +=
                item.speed;


            item.element.style.top =
                item.y + "px";


            const itemRect =
                item.element
                    .getBoundingClientRect();


            /* 碰撞 */

            if (
                checkCollision(
                    itemRect,
                    playerRect
                )
            ) {


                /* 炸彈 */

                if (item.bomb) {


                    score -= 20;


                    if (score < 0) {

                        score = 0;

                    }


                    lives--;


                    livesText.textContent =
                        "❤️".repeat(
                            Math.max(
                                0,
                                lives
                            )
                        );


                    /* 受傷動畫 */

                    player.style.transform =
                        "scale(0.8)";


                    setTimeout(
                        function() {

                            player.style.transform =
                                "scale(1)";

                        },
                        150
                    );

                }


                /* 月餅 */

                else {


                    score += 10;


                    /* 吃月餅動畫 */

                    player.style.transform =
                        "scale(1.25)";


                    setTimeout(
                        function() {

                            player.style.transform =
                                "scale(1)";

                        },
                        120
                    );

                }


                scoreText.textContent =
                    score;


                item.element.remove();


                items.splice(
                    i,
                    1
                );


                if (lives <= 0) {

                    endGame();

                }


                continue;

            }


            /* 掉出畫面 */

            if (
                item.y >
                game.clientHeight
            ) {


                item.element.remove();


                items.splice(
                    i,
                    1
                );

            }

        }

    }


    /* 下一幀 */

    requestAnimationFrame(
        gameLoop
    );

}


/* ==================================================
   遊戲結束
================================================== */

function endGame() {


    if (!gameRunning) {
        return;
    }


    gameRunning = false;


    clearInterval(
        gameTimer
    );

    clearInterval(
        createTimer
    );


    keyLeft = false;

    keyRight = false;


    /* 清除月餅 */

    items.forEach(
        item =>
            item.element.remove()
    );

    items = [];


    /* 最高分 */

    if (
        score >
        bestScore
    ) {


        bestScore =
            score;


        localStorage.setItem(
            "mooncakeBestScore",
            bestScore
        );


        bestText.textContent =
            "🎉 恭喜！創下新的最高分！";

    }

    else {


        bestText.textContent =
            "🏆 目前最高分：" +
            bestScore;

    }


    finalScore.textContent =
        score;


    gameOver
        .classList
        .remove("hidden");

}


/* ==================================================
   開始 / 重玩
================================================== */

startButton.addEventListener(
    "click",
    startGame
);


restartButton.addEventListener(
    "click",
    startGame
);


/* ==================================================
   視窗尺寸改變
================================================== */

window.addEventListener(
    "resize",
    function() {


        const maxX =
            game.clientWidth -
            player.offsetWidth;


        if (playerX < 0) {

            playerX = 0;

        }


        if (playerX > maxX) {

            playerX = maxX;

        }


        player.style.left =
            playerX + "px";

    }
);


/* ==================================================
   初始化
================================================== */

resetPlayer();


/* 啟動遊戲 */

requestAnimationFrame(
    gameLoop
);

</script>

</body>

</html>
